  evidence: 배송지 추가 화면(4245:46588)의 '배송 요청사항(선택)' 드롭다운. DIRECT 를 고르면 최대 50자 텍스트 필드가 열린다
  value_evidence_table: shipping_address
- name: NotificationSettingType
  domain: notification
  values:
  - TRADE_REQUEST
  - REQUEST_STATUS
  - REQUEST_AUTO_CANCEL
  - TRADE_STATUS
  - CHAT
  - WISHLIST_ITEM
  - FOLLOW
  - SERVICE_NEWS
  - MARKETING
  labels:
    TRADE_REQUEST: 거래 요청 — 새로운 거래 요청이 오면 알려드려요. (기본 ON)
    REQUEST_STATUS: 요청 상태 — 보낸 거래 요청의 진행 상태를 전해드려요. (기본 ON)
    REQUEST_AUTO_CANCEL: 요청 자동 취소 — 대기 중인 요청이 자동으로 취소되면 알려드려요. (기본 ON)
    TRADE_STATUS: 거래 상태 — 결제부터 정산까지 거래 진행 상황을 전해드려요. (기본 ON)
    CHAT: 채팅 알림 — 상대방에게 새 채팅이 오면 알림을 받아요. (기본 ON)
    WISHLIST_ITEM: 관심 아이템 — 관심 등록한 아이템의 가격 변동이나 거래 상태를 알려드려요. (기본 ON)
    FOLLOW: 팔로우 알림 — 누군가 나를 팔로우하면 알림을 받아요. (기본 OFF)
    SERVICE_NEWS: 서비스 소식 — 공지사항과 서비스 운영 관련 소식을 받아요. (기본 OFF)
    MARKETING: 혜택 및 마케팅 — 이벤트와 혜택 등 광고성 정보를 받아요. (기본 OFF)
  groups:
    필수: [TRADE_REQUEST, REQUEST_STATUS, REQUEST_AUTO_CANCEL, TRADE_STATUS]
    활동 알림: [CHAT, WISHLIST_ITEM, FOLLOW]
    서비스 알림: [SERVICE_NEWS, MARKETING]
  source: design
  evidence: 알림 설정 화면(3063:28457)의 토글 9종과 3개 그룹 헤더. 알림 목록 화면의 탭(NotificationCategory)과 축이 다르다 — 설정은 '무엇을 받을지', 탭은 '무엇을 모아볼지'다
