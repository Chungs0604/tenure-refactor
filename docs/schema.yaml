- name: ItemOwnership
  table: item_ownership
  domain: item
  description: 아이템의 소유 구간. 상품 상세 'Tenure 기록 기준' 섹션이 이 테이블 그대로다. 거래 완료 시 이전 행의 end_date 를 닫고 구매자 행을 새로 연다.
  soft_delete: false
  delete_policy: D
  delete_rationale: 0순위 — 이 테이블이 비워지면 '기록 승계'라는 서비스의 핵심 가치가 즉시 깨진다. 소유·승계 이력이므로 append-only 로 고정한다.
  source: design
  evidence:
  - '상품 상세 ''Tenure 기록 기준'': 유진나라 26.07.10~현재 OOTD 인증 12회 / 소소한 행복 25.02.8~26.07.10 OOTD 인증 8회 [최초 등록]'
  - '''구매자는 아이템의 기록을 이어서 받게됩니다.'''
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: itemId
    column: item_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 대상 아이템
  - name: ownerId
    column: owner_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 구간 소유자. 화면에 닉네임 표시
  - name: startDate
    column: start_date
    db_type: DATE
    java_type: LocalDate
    nullable: false
    source: design
    evidence: '''25.02.8 ~'' 구간 시작. **최초 구간은 item.first_owned_date 를 그대로 쓴다.** 거래로 승계된 구간은 구매 확정일'
  - name: endDate
    column: end_date
    db_type: DATE
    java_type: LocalDate
    nullable: true
    source: design
    evidence: '''~ 26.07.10'' 구간 종료. NULL 이면 ''~ 현재'''
  - name: acquiredBy
    column: acquired_by
    db_type: VARCHAR(30)
    java_type: AcquiredBy
    nullable: false
    enum: AcquiredBy
    source: design
    evidence: '''최초 등록'' 뱃지 유무'
  - name: orderId
    column: order_id
    db_type: BIGINT
    java_type: Long
    nullable: true
    source: inferred
    evidence: acquired_by=TRADE 일 때 근거 거래. AcquiredBy.TRADE 의 발생 근거 자리
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  indexes:
  - name: ix_item_ownership_item
    columns:
    - item_id
    - start_date
    unique: false
  - name: ix_item_ownership_owner
    columns:
    - owner_id
    unique: false
  - name: ix_item_ownership_order
    columns:
    - order_id
    unique: false
    note: FK 인덱스 — 거래로 승계된 구간 역추적
  constraints:
  - rule: item_id 당 end_date IS NULL 인 행은 최대 1개
    enforced_by: application
    source: design
    evidence: '''~ 현재'' 구간은 하나뿐'
  - rule: append-only. DELETE 금지. UPDATE 는 거래 완료 시 end_date 를 닫는 한 가지만 허용한다
    enforced_by: application
    source: design
    evidence: 확정 사양. start_date 는 등록 뒤에 바뀌지 않는다 (DEC-007)
  - rule: item.first_owned_date 는 등록 뒤에 수정할 수 없다. 최초 구간의 start_date 도 마찬가지다
    enforced_by: application
    source: design
    evidence: 구매자가 보고 산 "Tenure 기록 기준"이 사후에 달라지면 안 된다. item_wear_record 의 "종료된 구간은 손대지 못한다" 규칙과 같은 원리이며, 여기서는 종료 여부와 무관하게 막는다 (DEC-007)
  pattern: 유효 구간 (temporal validity)
  pattern_note: 소유 구간이 행으로 쌓이고 end_date IS NULL 이 현재 구간이다. 같은 아이템에 구간이 겹치지 않아야 하며, 0순위 테이블이라 append-only 다
  correction_path: 없다. start_date 는 등록 시점에 정해지고 바뀌지 않는다 (DEC-007). 날짜를 잘못 넣었으면 아이템을 지우고 다시 등록하는 수밖에 없다 — 그 경우 착용 기록은 승계되지 않는다
- name: ItemWearRecord
  table: item_wear_record
  domain: item
  description: 착용 기록('OOTD 인증'). PostItemTag 에서 파생 가능하지만 별도 테이블로 둔다 — 인증 횟수가 소유 구간별로 집계되므로 ownership_id 가 필요하고, 아이템이 승계된 뒤에도 이전 소유자의 인증 이력이 그대로 남아야 한다.
  soft_delete: false
  delete_policy: D
  delete_rationale: 0순위 — 'OOTD 인증 N회'는 이 서비스가 옷의 가치를 증명하는 유일한 수단이다. 활동·인증 기록이므로 append-only 로 고정한다.
  source: design
  evidence:
  - 상품 상세 'OOTD 인증 12회' / 'OOTD 인증 8회'
  - '''최근 착용'''
  - 채팅방 헤더 '판매 중 · 최근 착용 1일 전'
  - '''아이템 히스토리'' 사진 그리드'
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: itemId
    column: item_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 대상 아이템
  - name: ownershipId
    column: ownership_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 소유 구간별 'OOTD 인증 N회' 집계 단위
  - name: postId
    column: post_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 인증 근거 게시물. '아이템 히스토리'가 이 링크로 사진을 모은다
  - name: wornDate
    column: worn_date
    db_type: DATE
    java_type: LocalDate
    nullable: false
    source: design
    evidence: '''최근 착용'' 계산 기준. post.worn_date 를 복사'
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  - name: voidedAt
    column: voided_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: inferred
    evidence: 태그가 다른 아이템으로 바뀌거나 삭제되면 이 인증을 무효화한다. 행은 지우지 않는다(append-only). 인증 횟수 집계는 WHERE voided_at IS NULL
  - name: voidedReason
    column: voided_reason
    db_type: VARCHAR(30)
    java_type: WearRecordVoidReason
    nullable: true
    enum: WearRecordVoidReason
    source: inferred
    evidence: 화면에 노출되지 않는다 — 태그 변경·삭제로 인증을 무효화할 때 사유를 구분하려고 설계상 추가했다. voided_at 이 NULL 이 아닐 때만 채워진다
  indexes:
  - name: ix_item_wear_record_item
    columns:
    - item_id
    - voided_at
    - worn_date
    unique: false
    note: '''최근 착용'' 조회. item_id·voided_at 등치 → worn_date 정렬'
  - name: ix_item_wear_record_ownership
    columns:
    - ownership_id
    - voided_at
    unique: false
    note: 소유 구간별 'OOTD 인증 N회' 집계. 둘 다 등치 조건
  - name: uk_item_wear_record
    columns:
    - item_id
    - post_id
    unique: true
    note: 같은 게시물이 같은 아이템을 두 번 인증하지 않는다
  - name: ix_item_wear_record_post
    columns:
    - post_id
    unique: false
    note: FK 인덱스 — uk(item_id, post_id) 의 선두가 아니라 별도 필요
  constraints:
  - rule: append-only. DELETE 금지. 무효화는 voided_at 으로 표시한다
    enforced_by: application
    source: inferred
    evidence: 0순위 테이블
  - rule: ownership_id 가 종료된 구간(end_date IS NOT NULL)을 가리키면 해당 태그의 수정·삭제를 차단한다. 무효화는 현재 구간(end_date IS NULL)에 대해서만 허용된다
    enforced_by: application
    source: inferred
    evidence: 판매 후 이전 소유자가 과거 태그를 지우면 구매자가 보고 산 "OOTD 인증 N회"가 사후에 줄어든다. 기록 승계 약속이 깨지므로 원천 차단한다
  - rule: 태그 생성 시 (item_id, post_id) 로 void 된 행이 이미 있으면 INSERT 하지 말고 voided_at·voided_reason 을 NULL 로 되돌린다
    enforced_by: application
    source: inferred
    evidence: uk_item_wear_record(item_id, post_id) 때문에 void 후 같은 조합을 다시 태그하면 중복 키로 실패한다
  correction_path: voided_at + voided_reason(TAG_CHANGED|TAG_DELETED). 현재 소유 구간에 대해서만 허용하고, 종료된 구간의 태그는 수정·삭제 자체를 차단한다
- name: ItemListing
  table: item_listing
  domain: listing
  description: 아이템을 어떤 조건으로 팔았는지를 담는 판매 조건 스냅샷('판매 전환'). 판매 전환을 누를 때마다 새 행이 생기므로 Item 과 1:N 이고, 열린 행(closed_at IS NULL)은 아이템당 최대 1개다. 생성 전제로 판매자에게 PayoutAccount 가 있어야 한다. 판매 상태(sale_status)는 판매 등록이 없는 아이템도 '미판매'·'판매 완료'를 표시해야 해서 Item 으로 올렸다 (DEC-026). 관심 수와 구매 제안 허용도 같은 이유로 Item 에 있다 (DEC-024).
  soft_delete: false
  delete_policy: B
  delete_rationale: closed_at 으로 판매 종료를 표시한다. 거래·제안·채팅이 조건 스냅샷으로 참조하므로 물리 삭제하지 않는다
  source: design
  evidence:
  - 등록한 아이템 > 판매 전환
  - 상품 상세페이지
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: itemId
    column: item_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 판매 대상 아이템
  - name: sellerId
    column: seller_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: '''판매자 정보'' 섹션'
  - name: price
    column: price
    db_type: INT
    java_type: Integer
    nullable: false
    source: design
    evidence: '''가격'' 320,000원 (필수 표시 *). 판매 전환 폼에서 반드시 받으므로 NOT NULL 이다 — 미판매는 행이 없거나 닫힌 행이지 가격이 빈 행이 아니다 (DEC-026)'
  - name: shippingFee
    column: shipping_fee
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: '''배송비'' +5,000원. 기본 사용자는 고정값'
  - name: feeBearer
    column: fee_bearer
    db_type: VARCHAR(10)
    java_type: FeeBearer
    nullable: false
    enum: FeeBearer
    source: design
    evidence: '''수수료 부담''. 기본 사용자는 고정값'
  - name: sellerNote
    column: seller_note
    db_type: TEXT
    java_type: String
    nullable: true
    source: design
    evidence: '''판매자 설명'''
  - name: listedAt
    column: listed_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: design
    evidence: '''판매 게시가 완료됐습니다.''(2825:51746) — 행이 생기는 순간이 곧 게시 시각이라 NOT NULL 이다'
  - name: closedAt
    column: closed_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: design
    evidence: '''미판매로 변경시 화면''(2825:60351) — 판매를 내린 시각. NULL 이면 열려 있는 판매 등록이고 아이템당 1개뿐이다 (DEC-026)'
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  - name: updatedAt
    column: updated_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  indexes:
  - name: ix_item_listing_item
    columns:
    - item_id
    - closed_at
    unique: false
    note: 열린 판매 등록 1건을 찾는 조회가 가장 잦다. 폼 프리필은 같은 인덱스로 item_id 만 훑는다
  - name: ix_item_listing_seller
    columns:
    - seller_id
    - listed_at
    unique: false
    note: 판매자별 게시 이력. sale_status 가 Item 으로 가면서(DEC-026) 상태 필터는 여기서 못 건다
  constraints:
  - rule: item_id 당 closed_at IS NULL 인 행은 최대 1개다
    enforced_by: application
    source: inferred
    evidence: 열린 판매 등록이 둘이면 상세가 어느 가격을 그릴지 정할 수 없다. 미판매로 내릴 때 closed_at 을 찍으므로 자연히 유지된다 (DEC-026)
  - rule: 생성 시 판매자에게 payout_account 가 1개 이상 있어야 한다
    enforced_by: application
    source: design
    evidence: '''정산 계좌 없는 상태에서 판매 전환 누르면 (…) 화면 안 넘어가게 만들고 싶습니다.'''
  - rule: user.grade=BASIC 이면 fee_bearer 는 SELLER 고정, shipping_fee 는 입력 불가·항상 0 이다
    enforced_by: application
    source: design
    evidence: 확정 사양. '기본 사용자는 수수료 부담, 배송비를 선택하거나 작성할 수 없습니다. (고정입니다)'
  - rule: shipping_fee 가 부담 주체를 겸한다 — 0 이면 판매자 부담, 0보다 크면 구매자 부담
    enforced_by: application
    source: design
    evidence: 확정 사양
  - rule: 닫힌 행(closed_at IS NOT NULL)은 다시 열지 않는다. 미판매로 내린 뒤 판매 전환을 다시 누르면 새 행을 만든다
    enforced_by: application
    source: inferred
    evidence: |
      행을 되살려 UPDATE 하면 그 행을 가리키는 purchase_offer·chat_room 의 조건 스냅샷이
      사후에 바뀐다. CLAUDE.md 의 '금액은 거래 시점 스냅샷이며 원본이 바뀌어도 거래는 불변'
      원칙과 충돌한다. 화면은 목록 행 버튼(2825:52336)과 선택 모달(3910:43234) 모두 '판매 전환'
      하나뿐이라 신규·재등록을 구분하지 않는다 — 서버가 항상 새 행으로 처리한다.
      폼 프리필은 같은 아이템의 최신 닫힌 행에서 읽는다 (안내사항 3633:34232) (DEC-026)
- name: ListingFeaturedPost
