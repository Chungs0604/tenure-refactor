enums:
- name: Gender
  values:
  - MALE
  - FEMALE
  source: design
  evidence: 회원가입 > 프로필 작성 > 성별 칩 2종 '남성' '여성'
- name: UserGrade
  values:
  - BASIC
  - RECORD
  source: design
  evidence: 마이페이지 '레코드 사용자 <-> 기본 사용자'. 판매 전환 화면이 등급별로 2종('다 작성된 판매 전환 페이지 - 레코드 사용자 입장' / '- 기본 사용자 입장')
  value_evidence_table: user_grade_history
- name: UserStatus
  values:
  - ACTIVE
  - WITHDRAWN
  source: inferred
  evidence: 회원탈퇴 화면은 있으나 상태값 칩이 화면에 없음. 탈퇴 후에도 소유 이력이 남아야 해 물리 삭제 불가
  value_evidence_table: user_withdrawal
- name: AgreementType
  values:
  - SERVICE_TERMS
  - PRIVACY_POLICY
  - THIRD_PARTY_PROVISION
  source: design
  evidence: '회원가입 > 동의 받기: ''서비스 이용 약관 동의(필수)'' ''개인정보처리방침 동의 (필수)'' ''개인 정보의 제 3자 제공 (필수)'''
  value_evidence_table: user_agreement
- name: VerificationPurpose
  domain: auth
  storage: redis
  values:
  - SIGN_UP
  - PASSWORD_RESET
  source: design
  evidence: 회원가입과 비밀번호 찾기 두 섹션 모두 '인증번호' 입력 단계를 가진다. 어느 컬럼도 쓰지 않는다 — Redis 키 email-verify:{purpose}:{email} 의 일부다 (DEC-009)
- name: ReportTargetType
  values:
  - POST
  - ITEM
  - USER
  source: design
  evidence: '신고 진입점 3곳: OOTD 게시물 더보기, 상품 상세페이지, 채팅(상대 사용자)'
- name: ReportReason
  values:
  - COUNTERFEIT
  - INFO_MISMATCH
  - STOLEN_PHOTO
  - FRAUD_EXTERNAL_TRADE
  - PROHIBITED_ITEM
  - INAPPROPRIATE
  - NOT_WORN_OOTD
  - SPAM
  - PRIVACY_EXPOSURE
  - IRRELEVANT
  source: design
  evidence: 상품 상세 6종 + OOTD 더보기 6종의 합집합. '가품 또는 정품 의심' '상품 정보가 실제와 다름' '도용한 사진 또는 권리 침해' '사기 또는 외부 거래 유도' '거래 금지 품목' '부적절한 이미지 또는 내용' '사람이 직접 착용한 OOTD가 아님' '광고 또는 반복 게시물' '개인정보 노출' '서비스와 관련 없는 게시물'
  value_evidence_table: report
- name: NotificationCategory
  values:
  - ACTION_REQUIRED
  - ITEM_NEWS
  - TRADE_STATUS
  - WISHLIST
  source: design
  evidence: '알림 화면 탭: ''확인 필요'' ''아이템 소식'' ''거래 현황'' ''관심 등록'' (+''전체''는 필터 없음)'
  value_evidence_table: notification
- name: AspectRatio
  values:
  - RATIO_3_4
  - RATIO_4_5
  - RATIO_1_1
  source: design
  evidence: '''사진 비율은 총 3가지입니다. 3:4, 4:5, 1:1 비율에 따라 사진을 촬영할 수 있습니다.'' + 촬영 프레임 3종'
  value_evidence_table: post
- name: WearTarget
  values:
  - MALE
  - FEMALE
  - UNISEX
  source: design
  evidence: 아이템 등록 '착용 대상' 필드. 값 예시 '남성복'. 검색 필터에도 '필터/게시자성별' 별도 존재
  value_evidence_table: item
- name: ConditionCode
  values:
  - STAIN
  - TEAR
  - PILLING_DISCOLOR
  - REPAIRED
  - MISSING_PARTS
  labels:
    STAIN: 오염 있음
    TEAR: 찢어짐 있음
    PILLING_DISCOLOR: 보풀/변색 있음
    REPAIRED: 수선 이력 있음
    MISSING_PARTS: 구성품 누락 있음
  source: design
  evidence: '''상태 이상 체크'' 복수 선택 체크박스 5종'
  value_evidence_table: item_condition
- name: AcquiredBy
  values:
  - INITIAL_REGISTRATION
  - TRADE
  source: design
  evidence: 상품 상세 'Tenure 기록 기준'에서 최초 소유 구간에만 '최초 등록' 뱃지가 붙고, 이후 구간은 거래로 승계된다
  value_evidence_table: item_ownership
- name: SaleStatus
  values:
  - NOT_FOR_SALE
  - ON_SALE
  - SOLD
  labels:
    NOT_FOR_SALE: 미판매
    ON_SALE: 판매 중
    SOLD: 판매 완료
  source: design
  evidence: '상품 상세 프레임 4종: ''판매 상품 상세페이지'' / ''미판매 상품 상세 + 구매제안 on'' / ''미판매 상품 상세 - 구매제안 off'' / ''판매 완료 상세 페이지''. 상태 변경 프레임 ''미판매로 변경시 화면'' ''판매 완료로 변경'''
  value_evidence_table: item_listing
- name: FeeBearer
  values:
  - SELLER
  - BUYER
  - SPLIT
  source: design
  evidence: 판매 전환 화면 '수수료 부담' 선택. 레코드 사용자만 3종 중 고를 수 있고 기본 사용자는 SELLER 고정. SPLIT 은 확정 사양에서 추가된 값이라 피그마 화면에는 없다
  value_evidence_table: item_listing
  labels:
    SELLER: 판매자 부담
    BUYER: 구매자 부담
    SPLIT: 반반 부담
- name: OfferType
  values:
  - PURCHASE_OFFER
  - TRADE_INTENT
  source: design
  evidence: '''미판매 제품에 대한 구매제안 = 구매 제안을 보냈어요 / 판매 제품에 대한 거래의사 = 거래 의사를 보냈어요'''
  value_evidence_table: purchase_offer
- name: OfferStatus
  values:
  - PENDING
  - ACCEPTED
  - REJECTED
  - CANCELED
  - EXPIRED
  labels:
    PENDING: 응답 대기
  source: design
  evidence: '''응답 대기'' 칩 + ''구매 제안을 수락할까요?'' / ''거래 의사를 거절할까요?'' / ''구매 제안을 취소할까요?'' / ''판매자가 24시간 안에 응답하지 않으면 자동으로 취소됩니다'''
  value_evidence_table: purchase_offer
  value_evidence_columns:
    ACCEPTED: responded_at
    REJECTED: responded_at
    CANCELED: canceled_at
    EXPIRED: expired_at
- name: OrderStatus
  values:
  - PAYMENT_COMPLETED
  - SHIPPED
  - DELIVERED
  - PURCHASE_CONFIRMED
  - SETTLED
  - COMPLETED
  - CANCELED
  labels:
    PAYMENT_COMPLETED: 결제 완료
    SHIPPED: 상품 발송
    DELIVERED: 배송 완료
    PURCHASE_CONFIRMED: 구매 확정
    SETTLED: 정산 완료
    COMPLETED: 거래 완료
    CANCELED: 거래 취소
  source: design
  evidence: 거래 상세 '거래 진행 단계' 설명 문구에서 순서 확정 + 타임라인 체크 5단계(25.05.26 결제완료 → 25.05.28 상품발송 → 25.06.01 배송완료 → 25.06.02 구매확정 → 25.06.04 정산완료)
  value_evidence_table: order_status_history
- name: PaymentMethod
  values:
  - TOSS_PAY
  - KAKAO_PAY
  - NAVER_PAY
  labels:
    TOSS_PAY: 토스페이
    KAKAO_PAY: 카카오페이
    NAVER_PAY: 네이버페이
  source: design
  evidence: 결제 화면 '결제 수단' 라디오 3종
  value_evidence_table: payment
- name: PaymentStatus
  values:
  - AUTHORIZED
  - CAPTURED
  - RELEASED
  - REFUNDED
  source: design
  evidence: '''결제 승인이 임시로 확보되었습니다. 판매자가 수락하면 최종 결제되며, 거절·취소·만료 시 승인이 해제됩니다.'' + 상품 발송 전 거래 취소 시 환불(REFUNDED)'
  value_evidence_table: payment
  value_evidence_columns:
    AUTHORIZED: authorized_at
    CAPTURED: captured_at
    RELEASED: released_at
    REFUNDED: refunded_at
- name: CourierCode
  values:
  - CJ_LOGISTICS
  - KOREA_POST
  - GS_POSTBOX
  - CU_CONVENIENCE
  source: design
  evidence: 운송장 번호 입력 > '택배사' Select box 펼친 화면(2958:68218)의 4개 항목
  value_evidence_table: order_shipment
  labels:
    CJ_LOGISTICS: CJ대한통운
    KOREA_POST: 우체국택배
    GS_POSTBOX: GS Postbox
    CU_CONVENIENCE: CU 편의점택배
- name: ChatMessageType
  values:
  - TEXT
  - IMAGE
  source: design
  evidence: 메시지 입력창의 '사진' 첨부 버튼과 '전송' 버튼
  value_evidence_table: chat_message
- name: RecentViewTargetType
  domain: search
  storage: redis
  values:
  - POST
  - USER
  source: design
  evidence: '''최근 본 사용자가 있거나 최근 검색이 있을 경우'' + ''방금 보신 OOTD와 유사한 게시물'' — 게시물과 사용자 열람 이력을 모두 추적한다'
- name: NotificationTargetType
  values:
  - POST
  - ITEM
  - ORDER
  - OFFER
  - CHAT_ROOM
  source: inferred
  evidence: 알림 탭 4종이 각각 게시물·아이템·거래·제안으로 연결된다. 딥링크 대상 목록은 화면에 명시되지 않음
  value_evidence_table: notification
- name: WearRecordVoidReason
  values:
  - TAG_CHANGED
  - TAG_DELETED
  source: inferred
  evidence: 태그를 A→B 로 바꾸면 A 의 인증은 TAG_CHANGED 로, 태그를 지우면 TAG_DELETED 로 무효화한다. 화면에 노출되는 값은 아니다
  value_evidence_table: item_wear_record
  value_evidence_columns:
    TAG_CHANGED: voided_at
    TAG_DELETED: voided_at
- name: OfferCancelReason
  values:
  - BUYER_CANCELED
  - OTHER_OFFER_ACCEPTED
  source: design
  evidence: 제안자 본인 취소와, 같은 아이템의 다른 요청이 수락돼 시스템이 자동 취소한 경우를 구분한다
  value_evidence_table: purchase_offer
  value_evidence_columns:
    BUYER_CANCELED: canceled_at
    OTHER_OFFER_ACCEPTED: canceled_at
entities:
- name: User
  table: user
  domain: user
  description: 서비스 사용자. 계정 정보(실명·휴대폰)와 프로필(닉네임·체형)을 함께 보유한다.
  soft_delete: false
  delete_policy: B
  delete_rationale: status=WITHDRAWN 으로 대체. deleted_at 을 중복으로 두지 않는다. 탈퇴해도 행은 남아야 상품 상세 'Tenure 기록 기준'의 이전 소유자 표시가 유지된다
  source: design
  evidence:
  - 회원가입
  - 온보딩
  - 로그인 정보
  - 환경 설정
  - 마이페이지
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: email
    column: email
    db_type: VARCHAR(255)
    java_type: String
    nullable: false
    unique: true
    source: design
    evidence: 회원가입 > 이메일. '이미 존재하는 이메일입니다' / '유효하지 않은 이메일입니다'
  - name: passwordHash
    column: password_hash
    db_type: VARCHAR(255)
    java_type: String
    nullable: false
    source: design
    evidence: 회원가입 > 비밀번호 '(8자 이상)'. 평문 저장 불가로 해시 컬럼
  - name: realName
    column: real_name
    db_type: VARCHAR(50)
    java_type: String
    nullable: false
    source: design
    evidence: 로그인 정보 > 이름 '홍길동'
  - name: phone
    column: phone
    db_type: VARCHAR(20)
    java_type: String
    nullable: false
    source: design
    evidence: 로그인 정보 > 휴대폰번호 '821012345678'
  - name: nickname
    column: nickname
    db_type: VARCHAR(30)
    java_type: String
    nullable: false
    unique: true
    source: design
    evidence: 프로필 작성 > 닉네임. '중복된 닉네임입니다' / '닉네임을 설정해주세요.'
  - name: profileImageKey
    column: profile_image_key
    db_type: VARCHAR(500)
    java_type: String
    nullable: true
    source: design
    evidence: '''프로필 사진은 필수로 받지 않습니다! 등록하지 않았다면 기본 프로필 사진''. 저장소 키를 넣는다 (DEC-006)'
  - name: gender
    column: gender
    db_type: VARCHAR(10)
    java_type: Gender
    nullable: true
    enum: Gender
    source: design
    evidence: 프로필 작성 > 성별
  - name: heightCm
    column: height_cm
    db_type: SMALLINT
    java_type: Short
    nullable: true
    source: design
    evidence: 프로필 작성 > 키 '170cm'. 검색 필터 '필터/키-몸무게'의 대상
  - name: weightKg
    column: weight_kg
    db_type: SMALLINT
    java_type: Short
    nullable: true
    source: design
    evidence: 프로필 작성 > 몸무게 '64kg'
  - name: grade
    column: grade
    db_type: VARCHAR(20)
    java_type: UserGrade
    nullable: false
    default: BASIC
    enum: UserGrade
    source: design
    evidence: '''유저가 레코드 사용자인지, 기본 사용자인지에 따라 수수료 부담·배송비 섹션이 서로 다릅니다'''
  - name: status
    column: status
    db_type: VARCHAR(20)
    java_type: UserStatus
    nullable: false
    default: ACTIVE
    enum: UserStatus
    source: inferred
    evidence: 회원탈퇴 화면 존재 + 탈퇴 후에도 이력 참조 필요
  - name: anonymizedAt
    column: anonymized_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: inferred
    evidence: 탈퇴 시 개인정보 파기 시점. NULL이면 파기 전 (→ DEC-004)
  - name: gradeExpiresAt
    column: grade_expires_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: design
    evidence: 레코드 등급 보장 만료 시각(승격 +30일). 재평가 배치의 대상 선별 기준
  - name: followerCount
    column: follower_count
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: 검색 계정 탭·인기 사용자·OOTD 상세 헤더에 '팔로우 101명'이 목록으로 반복 노출된다. 정본은 follow 테이블
  - name: postCount
    column: post_count
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: 같은 목록에 '게시물 60개'·'피드 60개'·'OOTD 289개'가 함께 노출된다. 정본은 post 테이블
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  - name: updatedAt
    column: updated_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  indexes:
  - name: uk_user_email
    columns:
    - email
    unique: true
  - name: uk_user_nickname
    columns:
    - nickname
    unique: true
  - name: ix_user_body
    columns:
    - height_cm
    - weight_kg
    unique: false
    note: 검색 필터 '키-몸무게'
  - name: ix_user_grade_expiry
    columns:
    - grade
    - grade_expires_at
    unique: false
    note: 보장 만료된 레코드 사용자 재평가 대상 조회
  constraints:
  - rule: 레코드 승격 — 직전 30일간 '유효 OOTD'(post.deleted_at IS NULL 이면서 아이템 태그 1개 이상) 20개 이상. 기준 날짜는 post.created_at(게시일)
    enforced_by: application
    source: design
    evidence: 확정 사양. 착용일이 아닌 게시일 기준이라 과거 날짜 소급 게시로 수치를 만들 수 없다
  - rule: 승격은 게시 즉시 판정한다. 게시 트랜잭션에서 직전 30일 유효 OOTD 수를 세어 20이 되는 순간 RECORD 로 올리고 grade_expires_at 을 +30일로 세팅한다
    enforced_by: application
    source: design
    evidence: 확정 사양. 별도 승격 배치가 없다
  - rule: 보장 만료 시점에 직전 30일을 재평가해 미달이면 BASIC 으로 강등한다. 삭제된 OOTD 는 다음 재평가에서 제외되며 이미 이뤄진 승격을 소급 취소하지 않는다
    enforced_by: application
    source: design
    evidence: 확정 사양
  - rule: 강등 시 기존 item_listing 은 값을 그대로 유지한다. 신규 구매 요청부터 기본 사용자 규칙이 적용된다
    enforced_by: application
    source: design
    evidence: 확정 사양. listing.fee_bearer 를 UPDATE 하지 않으므로 재승격 시 저절로 복원된다
- name: UserGradeHistory
  table: user_grade_history
  domain: user
  description: 등급 변경 이력. UserGrade.RECORD 로의 승격이 언제·왜 일어났는지 기록할 자리.
  soft_delete: false
  delete_policy: D
  delete_rationale: 등급 변경 이력은 활동 기록이다. append-only
  source: inferred
  evidence:
  - 마이페이지 '레코드 사용자 <-> 기본 사용자' 전환 표기는 있으나 승격 조건·시점 화면이 없음(→ user 제약 — 레코드 승격). enum 값의 발생 근거를 남길 자리로 신설
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: userId
    column: user_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: inferred
    evidence: 대상 사용자
  - name: beforeGrade
    column: before_grade
    db_type: VARCHAR(20)
    java_type: UserGrade
    nullable: true
    enum: UserGrade
    source: inferred
    evidence: 최초 부여 시 NULL
  - name: afterGrade
    column: after_grade
    db_type: VARCHAR(20)
    java_type: UserGrade
    nullable: false
    enum: UserGrade
    source: inferred
    evidence: 변경 후 등급
  - name: windowStart
    column: window_start
    db_type: DATE
    java_type: LocalDate
    nullable: true
    source: design
    evidence: 평가 구간 시작(재평가 시점 -30일)
  - name: windowEnd
    column: window_end
    db_type: DATE
    java_type: LocalDate
    nullable: true
    source: design
    evidence: 평가 구간 종료
  - name: validOotdCount
    column: valid_ootd_count
    db_type: INT
    java_type: Integer
    nullable: true
    source: design
    evidence: 그 구간의 유효 OOTD 수. 승격·강등 판정의 근거값
  - name: changedAt
    column: changed_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 변경 시각
  indexes:
  - name: ix_user_grade_history_user
    columns:
    - user_id
    - changed_at
    unique: false
  pattern: 이력 테이블 (audit trail)
  pattern_note: before_grade / after_grade + window_start·window_end·valid_ootd_count + changed_at. 승격·강등 판정 근거를 함께 남긴다
  correction_path: 정정 경로 없음 — 승격·강등 판정이 시스템 자동이며 사용자 조작이 없다
- name: UserAgreement
