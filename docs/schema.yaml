  - name: shippingAddressDetail
    column: shipping_address_detail
    db_type: VARCHAR(255)
    java_type: String
    nullable: true
    source: inferred
    evidence: 제안서 상세의 상세주소 스냅샷
  - name: shippingDeliveryRequestType
    column: shipping_delivery_request_type
    db_type: VARCHAR(30)
    java_type: DeliveryRequestType
    nullable: true
    enum: DeliveryRequestType
    source: inferred
    evidence: 배송 요청사항 유형 스냅샷. 수락 시 order_shipment 로 복사한다
  - name: shippingDeliveryRequest
    column: shipping_delivery_request
    db_type: VARCHAR(50)
    java_type: String
    nullable: true
    source: inferred
    evidence: 배송 요청사항 직접입력 스냅샷. DIRECT 일 때만 채운다
  - name: status
    column: status
    db_type: VARCHAR(20)
    java_type: OfferStatus
    nullable: false
    default: PENDING
    enum: OfferStatus
    source: design
    evidence: '''응답 대기'' 칩'
  - name: expiresAt
    column: expires_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: design
    evidence: '''제안 만료까지 23시간 18분 남음'' = 생성 +24h'
  - name: respondedAt
    column: responded_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: design
    evidence: 판매자 수락/거절 시각. ACCEPTED·REJECTED 의 근거
  - name: canceledAt
    column: canceled_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: design
    evidence: '''구매 제안을 취소할까요?'' — CANCELED 의 근거'
  - name: cancelReason
    column: cancel_reason
    db_type: VARCHAR(30)
    java_type: OfferCancelReason
    nullable: true
    enum: OfferCancelReason
    source: design
    evidence: 취소 사유. 자동 취소는 1회 제한에서 제외된다
  - name: expiredAt
    column: expired_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: design
    evidence: 24h 만료 배치 기록. EXPIRED 의 근거
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  - name: updatedAt
    column: updated_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  indexes:
  - name: ix_purchase_offer_seller
    columns:
    - seller_id
    - status
    - expires_at
    unique: false
    note: 판매 내역 > 제안받음
  - name: ix_purchase_offer_buyer
    columns:
    - buyer_id
    - status
    unique: false
    note: 구매 내역 > 제안중
  - name: ix_purchase_offer_listing
    columns:
    - listing_id
    - status
    unique: false
  - name: ix_purchase_offer_expire
    columns:
    - status
    - expires_at
    unique: false
    note: 만료 배치
  - name: ix_purchase_offer_limit
    columns:
    - item_id
    - buyer_id
    - offer_type
    unique: false
    note: 1회 제한 판정
  - name: ix_purchase_offer_item_pending
    columns:
    - item_id
    - status
    unique: false
    note: 수락 시 같은 아이템의 나머지 대기 요청을 자동 취소하기 위한 조회
  - name: uk_purchase_offer_limit
    columns:
    - (IF(offer_type='PURCHASE_OFFER' AND NOT(status='CANCELED' AND cancel_reason<>'BUYER_CANCELED'), item_id, NULL))
    - (IF(offer_type='PURCHASE_OFFER' AND NOT(status='CANCELED' AND cancel_reason<>'BUYER_CANCELED'), buyer_id, NULL))
    unique: true
    note: 1회 제한을 애플리케이션 판정에만 맡기면 동시 요청 두 건이 둘 다 통과해 중복 제안·중복
      결제 승인이 생긴다. uk_payout_account_default·uk_shipping_address_default 와 같은
      함수형 인덱스로 DB 가 한 번 더 막는다
  constraints:
  - rule: offer_type=PURCHASE_OFFER 는 (item_id, buyer_id) 당 1행. 단 cancel_reason 이 BUYER_CANCELED 가 아닌(시스템 취소) 행은 제외하고 판정한다. uk_purchase_offer_limit 가 이 규칙을 DB 수준에서도 강제한다
    enforced_by: application
    source: design
    evidence: '''판매 중이 아닌 패션 아이템에 1회만'' + ''취소·만료·거절되면 복구되지 않아요''. 다만 자동 취소는 제안자 잘못이 아니므로 기회를 돌려준다'
  - rule: append-only. DELETE 금지
    enforced_by: application
    source: design
    evidence: 행이 지워지면 1회 제한이 무력화된다
  - rule: 24시간 무응답이면 EXPIRED 로 자동 만료한다. 사용자 취소·시스템 취소의 CANCELED 와 구분한다
    enforced_by: application
    source: design
    evidence: '''판매자가 24시간 안에 응답하지 않으면 자동으로 취소됩니다'''
  - rule: 같은 아이템의 요청 하나를 수락하면 나머지 PENDING 을 전부 CANCELED + OTHER_OFFER_ACCEPTED 로 전이하고, 각 결제 승인을 해제한 뒤 알림을 보낸다
    enforced_by: application
    source: design
    evidence: 확정 사양
  - rule: 차단 관계(user_block)가 양방향 중 하나라도 있으면 새 거래 의사·구매 제안을 생성할 수 없다
    enforced_by: application
    source: design
    evidence: 확정 사양
  - rule: '수수료 계산 — 총수수료 = floor(offer_price × fee_rate). 배송비에는 수수료를 붙이지 않는다. SELLER: 구매자 0/판매자 총액, BUYER: 구매자 총액/판매자 0, SPLIT: 구매자 floor(총액/2)·판매자 나머지(홀수 1원은 판매자)'
    enforced_by: application
    source: design
    evidence: 확정 사양
  - rule: 미판매 아이템 구매 제안의 배송비는 항상 0원(판매자 부담)이다. 미판매 아이템은 판매 전환을 거치지 않아 배송비가 설정된 적이 없다
    enforced_by: application
    source: design
    evidence: 확정 사양. 설정의 기본 배송비 기능은 이번 범위에서 제외했다
  pattern: 단일 테이블 상속 (STI)
  pattern_note: 구매 제안(미판매)과 거래 의사(판매 중)를 offer_type 으로 한 테이블에 합쳤다 — 생명주기(24h 만료·수락/거절/취소)와 화면 구성이 거의 동일하고 목록에서 함께 조회되기 때문이다
  correction_path: 정정 경로 없음 — 취소·거절·만료가 status + cancel_reason 으로 표현된다
