    error_codes: [PayoutErrorCode]
  - name: post
    description: OOTD 게시물·사진·아이템 태그·좋아요·저장
    error_codes: [PostErrorCode]
  - name: item
    description: 아이템과 부속(사진·실측·상태)·소유 구간·착용 기록
    error_codes: [ItemErrorCode]
  - name: category
    description: 2단 카테고리 마스터. 운영이 관리한다
    error_codes: [CategoryErrorCode]
  - name: listing
