    source: design
    evidence: '''배송비'' +5,000원'
  - name: feeAmount
    column: fee_amount
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: '''수수료''. 화면 예시 0원(판매자 기준) / +12,000원(구매자 기준) (→ purchase_offer 제약 — 수수료 계산)'
  - name: feeBearer
    column: fee_bearer
