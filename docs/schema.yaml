  delete_policy: A
  delete_rationale: '''삭제한 게시물은 다시 복구할 수 없어요''는 복구 UI를 주지 않는다는 UX 문구이지 물리 삭제 지시가 아니다. 하드 삭제하면 (1) 판매 등록의 대표 OOTD(listing_featured_post)가 끊기고 (2) 신고(report)의 검토 대상이 사라지며 (3) item_wear_record 의 착용 근거가 사라져 기록 승계가 깨진다.'
  source: design
  evidence:
  - OOTD 게시물 올리는 과정
  - 홈
  - 마이페이지
  - OOTD 게시물
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
