conventions:
  db: mysql8
  db_source: 프로젝트 CLAUDE.md 에서 확인 — 'MySQL 8. JPA 규칙은 db-mysql 스킬을 따른다'. build.gradle 의 com.mysql:mysql-connector-j 와 일치
  naming: snake_case, 테이블명 단수형
  charset: utf8mb4
  collation: utf8mb4_0900_ai_ci
  pk: BIGINT AUTO_INCREMENT, 컬럼명 id, java_type Long
  fk: <참조테이블>_id. 모든 FK에 인덱스
  money: INT (원 단위, 소수 없음), java_type Integer
  datetime: DATETIME(6), java_type LocalDateTime
  enum: VARCHAR + 애플리케이션 enum. DB ENUM 타입 미사용
  audit: 모든 테이블에 created_at. 변경 가능한 테이블에 updated_at
  soft_delete: "4분류로 관리한다. (A) deleted_at 컬럼 보유: post, item — 삭제 후에도 다른 화면에서 참조되어야 하는 것. (B) 상태 컬럼으로 대체: user.status, item_listing.closed_at, chat_room_member.left_at,\n    purchase_offer.status, trade_order.status — deleted_at 을 중복으로 두지 않는다.\n(C) 하드 삭제: 취소가 곧 삭제이며 이력 가치가 없는 것(wishlist, post_like, post_save,\n    follow, user_block, search_history, recent_view, notification), 부모에 종속된 것,\n    스냅샷 덕에 참조가 끊기지 않는 것(shipping_address, payout_account).\n(D) 삭제 금지(append-only): trade_order, payment, settlement, order_status_history,\n    item_ownership, item_wear_record, purchase_offer, user_agreement, report, user_grade_history.\nA 분류 테이블을 가리키는 FK 는 전부 RESTRICT 로 고정한다."
domain_packages:
  note: |
    각 엔티티의 domain 필드가 가리키는 패키지다. com.tenure.domain.<이름> 아래에
    controller · dto · entity · enums · exception · mapper · repository · service 를 둔다.
    enum 은 entity 와 나란한 enums 패키지에 둔다 (enum 은 자바 예약어라 패키지명으로 쓸 수 없다).
    ErrorCode 는 도메인당 최대 1개이며 이름은 코드 접두사와 일치한다.
