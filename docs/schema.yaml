    error_codes: [OrderErrorCode]
  - name: settlement
    description: 판매자 정산
    error_codes: []
  - name: chat
    description: 채팅방·참여자·메시지
    error_codes: [ChatErrorCode]
  - name: notification
    description: 알림과 수신 설정
    error_codes: [NotificationErrorCode]
