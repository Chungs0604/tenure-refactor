    evidence: '대분류 10종(화면 순서): 아우터·상의·하의·신발·가방·모자·치마·원피스·액세서리·주얼리. 세부 102종. 값은 V2__seed_category.sql 이 정본'
  - name: depth
    column: depth
    db_type: INT
    java_type: Integer
    nullable: false
    source: design
    evidence: 1=카테고리, 2=세부 카테고리
  - name: sizeScheme
    column: size_scheme
    db_type: VARCHAR(30)
    java_type: SizeScheme
    enum: SizeScheme
    nullable: true
    source: design
    evidence: 이 대분류가 쓰는 사이즈 칩 세트. 칩 목록은 size_option 이 갖는다. 세부 카테고리(depth=2)는 NULL 이며 부모에서 읽는다 — 상세 수정 바텀시트 10종에서 매핑을 확정했다 (Q6 해소, DEC-025)
  - name: measurementScheme
    column: measurement_scheme
    db_type: VARCHAR(20)
    java_type: MeasurementScheme
    enum: MeasurementScheme
    nullable: true
    source: design
    evidence: '이 대분류가 받는 실측 항목 세트. size_scheme 으로 대신할 수 없다 — 하의와 치마가 둘 다 BOTTOM 인데 실측이 다르다. 판매 전환 화면(3342:32943)이 ''실측 입력 · 바지'' 처럼 대분류별로 다른 입력란을 그려 프론트도 이 값이 필요하다. 세부 카테고리는 NULL 이며 부모에서 읽는다 (DEC-027)'
  - name: sortOrder
    column: sort_order
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: inferred
    evidence: 드롭다운 노출 순서
  indexes:
  - name: ix_category_parent
    columns:
    - parent_id
    - sort_order
    unique: false
  pattern: 자기 참조
  pattern_note: parent_id nullable, depth 로 2단(카테고리 > 세부 카테고리)을 고정한다. 하위가 있으면 RESTRICT 로 삭제를 막는다
- name: SizeOption
  table: size_option
  domain: category
  description: 카테고리별 사이즈 칩 목록. 값은 V15__size_option.sql 이 정본이며 애플리케이션이 만들지 않는다. 프론트가 칩을 하드코딩하지 않도록 API-090 이 카테고리 트리와 함께 내려준다 (DEC-025).
