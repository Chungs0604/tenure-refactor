- name: Post
  table: post
  domain: post
  description: OOTD 게시물. 착용 날짜를 갖고 마이페이지에서 날짜별로 조회된다.
  soft_delete: true
  delete_policy: A
  delete_rationale: '''삭제한 게시물은 다시 복구할 수 없어요''는 복구 UI를 주지 않는다는 UX 문구이지 물리 삭제 지시가 아니다. 하드 삭제하면 (1) 판매 등록의 대표 OOTD(listing_featured_post)가 끊기고 (2) 신고(report)의 검토 대상이 사라지며 (3) item_wear_record 의 착용 근거가 사라져 기록 승계가 깨진다.'
  source: design
  evidence:
  - OOTD 게시물 올리는 과정
  - 홈
  - 마이페이지
  - OOTD 게시물
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: authorId
    column: author_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 게시물 작성자. OOTD 상세 상단 프로필
  - name: wornDate
    column: worn_date
    db_type: DATE
    java_type: LocalDate
    nullable: false
    source: design
    evidence: '''달력 아이콘 클릭'' → ''날짜 선택''. 마이페이지 날짜별 캘린더와 ''최근 착용''의 기준'
  - name: aspectRatio
    column: aspect_ratio
    db_type: VARCHAR(15)
    java_type: AspectRatio
    nullable: false
    enum: AspectRatio
    source: design
    evidence: 촬영 비율 3종
  - name: quickPosted
    column: quick_posted
    db_type: BOOLEAN
    java_type: Boolean
    nullable: false
    default: false
    source: design
    evidence: '''자동 태그되어 바로 게시됨''. 태그 일괄 수정 대상 판별(3일 이내)에 필요'
  - name: deletedAt
    column: deleted_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: design
    evidence: '''게시물 삭제하기''. soft delete'
  - name: likeCount
    column: like_count
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: OOTD 상세 하단 '♡ 1234'. 정본은 post_like 테이블
  - name: saveCount
    column: save_count
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: OOTD 상세 하단 '🔖 1234'. 정본은 post_save 테이블
  - name: viewCount
    column: view_count
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: 검색 결과(2825:39649)의 정렬 드롭다운에 '조회수 순'이 있다. 조회는 Redis 카운터로 받고 주기적으로 이 컬럼에 반영한다 — 읽기 경로에 DB 쓰기를 붙이지 않는다 (DEC-019)
  - name: rankScore
    column: rank_score
    db_type: DECIMAL(6,4)
    java_type: BigDecimal
    nullable: false
    default: 0
    source: design
    evidence: 검색 결과(2825:39649)의 기본 정렬 '추천 순'의 정렬 키. 인기와 신선도를 합친 값을 배치가 갱신한다 (DEC-023). 조회 시점 계산은 인덱스를 못 타고 커서 경계를 흔든다
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  - name: updatedAt
    column: updated_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: design
    evidence: '''완료를 누르면 게시물 전체가 수정'''
  indexes:
  - name: ix_post_author_date
    columns:
    - author_id
    - deleted_at
    - worn_date
    unique: false
    note: 마이페이지 날짜별 조회
  - name: ix_post_feed
    columns:
    - deleted_at
    - created_at
    unique: false
    note: 홈 피드 / 새로 올라온 OOTD
  - name: ix_post_author_created
    columns:
    - author_id
    - deleted_at
    - created_at
    unique: false
    note: 레코드 승격 판정 — 직전 30일 유효 OOTD 카운트. 게시일 기준이라 worn_date 인덱스와 별개
  - name: ix_post_rank_score
    columns:
    - deleted_at
    - rank_score
    - id
    unique: false
    note: 검색 추천 순 (DEC-023). V13 이 미뤄 둔 인덱스를 api-spec.md API-200 확정 후 V22 에서 추가
  - name: ix_post_like_count
    columns:
    - deleted_at
    - like_count
    - id
    unique: false
    note: 검색 좋아요 순 (V22)
  - name: ix_post_view_count
    columns:
    - deleted_at
    - view_count
    - id
    unique: false
    note: 검색 조회수 순 (DEC-019, V22)
  - name: ix_post_save_count
    columns:
    - deleted_at
    - save_count
    - id
    unique: false
    note: 검색 저장 순 (V22)
  constraints:
  - rule: 본문(캡션) 컬럼을 두지 않는다. 작성 플로우(촬영 → 비율 → 날짜 → 태그 → 미리보기 → 게시하기)에 입력란이 없고 OOTD 상세에도 표시 영역이 없다
    enforced_by: application
    source: design
    evidence: 게시물 미리보기(3380:33759)의 버튼은 '태그 수정'과 '게시하기' 둘뿐이다. v3 의 content 컬럼은 홈 헤더 인사말 '안녕하세요 SSU님!'을 본문 예시로 잘못 인용해 생긴 것이라 v5 에서 제거했다
  - rule: 판매 중(item.sale_status=ON_SALE)인 아이템의 대표 OOTD로 걸린 게시물은 삭제 불가
    enforced_by: application
    source: inferred
    evidence: '''대표 OOTD (1개 이상)'' 제약과 충돌하므로. 판매 종료 후에는 삭제 가능'
