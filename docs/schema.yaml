  value_evidence_columns:
    BUYER_CANCELED: canceled_at
    OTHER_OFFER_ACCEPTED: canceled_at
    LISTING_DELISTED: canceled_at
entities:
- name: User
  table: user
  domain: user
  description: 서비스 사용자. 계정 정보(실명·휴대폰)와 프로필(닉네임·체형)을 함께 보유한다.
  soft_delete: false
  delete_policy: B
  delete_rationale: status=WITHDRAWN 으로 대체. deleted_at 을 중복으로 두지 않는다. 탈퇴해도 행은 남아야 상품 상세 'Tenure 기록 기준'의 이전 소유자 표시가 유지된다
  source: design
  evidence:
  - 회원가입
  - 온보딩
  - 로그인 정보
  - 환경 설정
  - 마이페이지
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: email
    column: email
    db_type: VARCHAR(255)
    java_type: String
    nullable: false
    unique: true
    source: design
    evidence: 회원가입 > 이메일. '이미 존재하는 이메일입니다' / '유효하지 않은 이메일입니다'
  - name: passwordHash
    column: password_hash
    db_type: VARCHAR(255)
    java_type: String
    nullable: true
    source: design
    evidence: 회원가입 > 비밀번호 '(8자 이상)'. 평문 저장 불가로 해시 컬럼. 소셜 가입은 비밀번호가 없어 NULL 이다 (DEC-017)
  - name: provider
    column: provider
    db_type: VARCHAR(20)
    java_type: UserProvider
    nullable: false
    default: LOCAL
    enum: UserProvider
    source: design
    evidence: 로그인 화면(2791:15250)의 '다음' 구분선 아래 구글·네이버 아이콘. 이메일 가입은 LOCAL
  - name: providerId
    column: provider_id
    db_type: VARCHAR(100)
    java_type: String
    nullable: true
    source: design
    evidence: 소셜 제공자가 주는 고유 식별자. LOCAL 이면 NULL 이다
  - name: realName
    column: real_name
    db_type: VARCHAR(50)
    java_type: String
    nullable: false
    source: design
    evidence: 로그인 정보 > 이름 '홍길동'
  - name: phone
    column: phone
    db_type: VARCHAR(20)
    java_type: String
    nullable: false
    source: design
    evidence: 로그인 정보 > 휴대폰번호 '821012345678'
  - name: nickname
    column: nickname
    db_type: VARCHAR(30)
    java_type: String
    nullable: false
    unique: true
    source: design
    evidence: 프로필 작성 > 닉네임. '중복된 닉네임입니다' / '닉네임을 설정해주세요.'
  - name: profileImageKey
    column: profile_image_key
    db_type: VARCHAR(500)
    java_type: String
    nullable: true
    source: design
    evidence: '''프로필 사진은 필수로 받지 않습니다! 등록하지 않았다면 기본 프로필 사진''. 저장소 키를 넣는다 (DEC-006)'
  - name: gender
    column: gender
    db_type: VARCHAR(10)
    java_type: Gender
    nullable: true
    enum: Gender
    source: design
    evidence: 프로필 작성 > 성별
  - name: heightCm
    column: height_cm
    db_type: INT
    java_type: Integer
    nullable: true
    source: design
    evidence: 프로필 작성 > 키 '170cm'. 검색 필터 '필터/키-몸무게'의 대상
  - name: weightKg
    column: weight_kg
    db_type: INT
    java_type: Integer
    nullable: true
    source: design
    evidence: 프로필 작성 > 몸무게 '64kg'
  - name: grade
    column: grade
    db_type: VARCHAR(20)
    java_type: UserGrade
    nullable: false
    default: BASIC
    enum: UserGrade
    source: design
    evidence: '''유저가 레코드 사용자인지, 기본 사용자인지에 따라 수수료 부담·배송비 섹션이 서로 다릅니다'''
  - name: status
    column: status
    db_type: VARCHAR(20)
    java_type: UserStatus
    nullable: false
    default: ACTIVE
    enum: UserStatus
    source: inferred
    evidence: 화면에 상태 칩이 없다 — 회원탈퇴 화면은 있으나 ACTIVE/WITHDRAWN 을 노출하지 않는다. 탈퇴 후에도 소유 이력이 남아야 해 물리 삭제가 불가능하므로 설계상 추가했다
  - name: anonymizedAt
    column: anonymized_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: inferred
    evidence: 탈퇴 시 개인정보 파기 시점. NULL이면 파기 전 (→ DEC-004)
  - name: gradeExpiresAt
    column: grade_expires_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: design
    evidence: 레코드 등급 보장 만료 시각(승격 +30일). 재평가 배치의 대상 선별 기준
  - name: followerCount
    column: follower_count
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: 검색 계정 탭·인기 사용자·OOTD 상세 헤더에 '팔로우 101명'이 목록으로 반복 노출된다. 정본은 follow 테이블
  - name: postCount
    column: post_count
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: 같은 목록에 '게시물 60개'·'피드 60개'·'OOTD 289개'가 함께 노출된다. 정본은 post 테이블
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  - name: updatedAt
    column: updated_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  indexes:
  - name: uk_user_email
    columns:
    - email
    unique: true
  - name: uk_user_nickname
    columns:
    - nickname
    unique: true
  - name: uk_user_provider
    columns:
    - provider
    - provider_id
    unique: true
    note: 같은 소셜 계정으로 두 번 가입하지 못하게 막는다. LOCAL 은 provider_id 가 NULL 이라 중복이 허용된다
  - name: ix_user_body
    columns:
    - height_cm
    - weight_kg
    unique: false
    note: 검색 필터 '키-몸무게'
  - name: ix_user_grade_expiry
    columns:
    - grade
    - grade_expires_at
    unique: false
    note: 보장 만료된 레코드 사용자 재평가 대상 조회
  constraints:
  - rule: 레코드 승격 — 직전 30일간 '유효 OOTD'(post.deleted_at IS NULL 이면서 아이템 태그 1개 이상) 20개 이상. 기준 날짜는 post.created_at(게시일)
    enforced_by: application
    source: design
    evidence: 확정 사양. 착용일이 아닌 게시일 기준이라 과거 날짜 소급 게시로 수치를 만들 수 없다
  - rule: 승격은 게시 즉시 판정한다. 게시 트랜잭션에서 직전 30일 유효 OOTD 수를 세어 20이 되는 순간 RECORD 로 올리고 grade_expires_at 을 +30일로 세팅한다
    enforced_by: application
    source: design
    evidence: 확정 사양. 별도 승격 배치가 없다
  - rule: 보장 만료 시점에 직전 30일을 재평가해 미달이면 BASIC 으로 강등한다. 삭제된 OOTD 는 다음 재평가에서 제외되며 이미 이뤄진 승격을 소급 취소하지 않는다
    enforced_by: application
    source: design
    evidence: 확정 사양
  - rule: 강등 시 기존 item_listing 은 값을 그대로 유지한다. 신규 구매 요청부터 기본 사용자 규칙이 적용된다
    enforced_by: application
    source: design
    evidence: 확정 사양. listing.fee_bearer 를 UPDATE 하지 않으므로 재승격 시 저절로 복원된다
- name: UserGradeHistory
  table: user_grade_history
  domain: user
  description: 등급 변경 이력. UserGrade.RECORD 로의 승격이 언제·왜 일어났는지 기록할 자리.
