- name: PurchaseOffer
  table: purchase_offer
  domain: offer
  description: 구매 제안 / 거래 의사. 대상 상태에 따라 두 종류로 나뉘며 생명주기가 같아 한 테이블로 둔다. 두 경우 모두 결제 승인이 먼저 잡히고 판매자 수락 시 최종 결제된다.
  soft_delete: false
  delete_policy: D
  delete_rationale: 0순위 — '구매 제안이 취소·만료·거절되면 사용한 제안 기회는 복구되지 않아요'. 행이 지워지면 1회 제한이 그대로 무력화되므로 append-only 로 고정한다.
  source: design
  evidence:
  - 구매 제안/ 구매
  - 명세된 구매 제안서
  - 판매 내역 > 제안받음
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: listingId
    column: listing_id
    db_type: BIGINT
    java_type: Long
    nullable: true
    source: design
    evidence: 제안 대상 판매 등록. PURCHASE_OFFER(미판매 제안)는 판매 등록이 없어 NULL 이고 TRADE_INTENT 만 값을 갖는다 (DEC-024)
  - name: itemId
    column: item_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: inferred
    evidence: 1회 제한 판정을 아이템 기준으로 하기 위해 중복 보유(→ purchase_offer 제약 — 아이템당 1회)
  - name: buyerId
    column: buyer_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: '''구매자 정보'' 섹션'
  - name: sellerId
    column: seller_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: '''판매자 정보'' 섹션. ''YuJin님에게'''
  - name: offerType
    column: offer_type
    db_type: VARCHAR(20)
    java_type: OfferType
    nullable: false
    enum: OfferType
    source: design
    evidence: 구매 제안 / 거래 의사
  - name: offerPrice
    column: offer_price
    db_type: INT
    java_type: Integer
    nullable: false
    source: design
    evidence: '''제안 금액'' / ''제안 가격'' 360,000원'
  - name: shippingFee
    column: shipping_fee
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: '''배송비'' +5,000원'
  - name: feeAmount
    column: fee_amount
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: '''수수료''. 화면 예시 0원(판매자 기준) / +12,000원(구매자 기준) (→ purchase_offer 제약 — 수수료 계산)'
  - name: feeBearer
    column: fee_bearer
    db_type: VARCHAR(10)
    java_type: FeeBearer
    nullable: false
    enum: FeeBearer
    source: design
    evidence: 요청 시점에 확정되는 수수료 부담. 소유자가 BASIC 이면 SELLER 로 강제된다
  - name: feeRate
    column: fee_rate
    db_type: DECIMAL(5,4)
    java_type: BigDecimal
    nullable: false
    source: design
    evidence: 적용 요율 스냅샷. 요청 전송 시점의 소유자 등급 기준(BASIC 0.06 / RECORD 0.03)
  - name: buyerFeeAmount
    column: buyer_fee_amount
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: 구매자 부담 수수료. SPLIT 이면 floor(총액/2)
  - name: sellerFeeAmount
    column: seller_fee_amount
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: 판매자 부담 수수료. SPLIT 이면 총액 - 구매자분(홀수 1원은 판매자)
  - name: totalPaymentAmount
    column: total_payment_amount
    db_type: INT
    java_type: Integer
    nullable: false
    source: design
    evidence: '''총 결제 금액'' 377,000원 (구매자 기준)'
  - name: expectedPayoutAmount
    column: expected_payout_amount
    db_type: INT
    java_type: Integer
    nullable: false
    source: design
    evidence: '''총 정산 예정 금액'' 365,000원 (판매자 기준)'
  - name: buyerRequest
    column: buyer_request
    db_type: VARCHAR(500)
    java_type: String
    nullable: true
    source: design
    evidence: '''거래 요청사항'' / ''구매자 요청사항'''
  - name: shippingRecipientName
    column: shipping_recipient_name
    db_type: VARCHAR(50)
    java_type: String
    nullable: false
