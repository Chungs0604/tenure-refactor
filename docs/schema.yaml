    db_type: VARCHAR(10)
    java_type: String
    nullable: false
    source: inferred
    evidence: 화면에는 없지만 수락 시 order_shipment 로 복사하려면 필요하다
  - name: shippingAddress
    column: shipping_address
    db_type: VARCHAR(255)
