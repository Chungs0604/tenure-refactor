    enforced_by: application
    source: design
    evidence: 칩에서 고르는 값이라 자유 입력이 아니다. FK 로 묶지 않는 이유는 스냅샷이기 때문 (DEC-025)
- name: Item
  table: item
  domain: item
  description: 패션 아이템. 소유자가 바뀌어도 이 행은 유지된다 — 착용 기록이 아이템에 영구 귀속되어야 "구매자는 아이템의 기록을 이어서 받게됩니다"가 성립한다. 현재 소유자와 보유 기간은 ItemOwnership 에서 조회한다.
  soft_delete: true
  delete_policy: A
  delete_rationale: 태그된 아이템 목록에 '삭제된 아이템' 상태가 존재한다(회색 처리 + 문구). 이 화면을 그리려면 아이템이 삭제돼도 post_item_tag 가 살아 있어야 하므로 물리 삭제가 불가능하다. 소유 이력·착용 기록·거래도 이 행을 참조한다.
  source: design
  evidence:
  - 등록한 아이템
  - 상품 상세페이지
  - OOTD 게시물 올리는 과정 > 새 아이템 등록
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: registrantId
    column: registrant_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 최초 등록자. 'Tenure 기록 기준' 최초 구간의 '최초 등록' 뱃지
  - name: name
    column: name
    db_type: VARCHAR(100)
    java_type: String
    nullable: false
    source: design
    evidence: '''아이템명''. 예 ''LVC 1955 501'''
  - name: brandName
    column: brand_name
    db_type: VARCHAR(100)
    java_type: String
    nullable: false
    source: design
    evidence: '''브랜드명''. 예 ''Levis'''
  - name: categoryId
    column: category_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: '''세부 카테고리''(depth=2)를 가리킨다'
  - name: sizeLabel
    column: size_label
    db_type: VARCHAR(20)
    java_type: String
    nullable: true
    source: design
    evidence: '''사이즈''. 예 ''L'''
  - name: wearTarget
    column: wear_target
    db_type: VARCHAR(10)
    java_type: WearTarget
    nullable: false
    enum: WearTarget
    source: design
    evidence: 아이템 등록(2825:47795)과 판매 전환(3342:32943) 모두 '착용 대상'에 필수 표시(*)가 붙어 있다. 칩 라벨은 화면마다 다르다 — 등록은 '남자/여자/공용', 판매 전환은 '남성복/여성복/공용'
  - name: coverImageKey
    column: cover_image_key
    db_type: VARCHAR(500)
    java_type: String
    nullable: false
    source: design
    evidence: '''대표 사진'' (필수 표시 *). 저장소 키를 넣는다 (DEC-006)'
  - name: description
    column: description
    db_type: TEXT
    java_type: String
    nullable: true
    source: design
    evidence: '''제품 설명'' / ''상품 설명''. 다만 입력 화면도 표시 화면도 없어 API 로는 채우지 않는다 — 화면의 ''상품 설명''은 판매 전환에서 받는 item_listing.seller_note 다 (B-14). 컬럼은 남겨 두고 쓰는 화면이 생기면 연다'
  - name: firstOwnedDate
    column: first_owned_date
    db_type: DATE
    java_type: LocalDate
    nullable: true
    source: design
    evidence: '''최초 보유 날짜''. 예 25.02.8. 최초 item_ownership 구간의 start_date 와 같은 값이며, 등록 뒤에는 수정할 수 없다 (DEC-007)'
  - name: saleStatus
    column: sale_status
    db_type: VARCHAR(20)
    java_type: SaleStatus
    nullable: false
    default: NOT_FOR_SALE
    enum: SaleStatus
    source: design
    evidence: '히어로 하단 배지 ''판매 중''(2825:57089) / ''미판매''(2825:58233) / ''판매 완료''(2825:58566). 세 화면 모두 헤더가 ''아이템 상세''이고 판매 등록이 없는 아이템도 ''미판매''·''판매 완료''를 표시하므로 아이템이 갖는다 (DEC-026)'
  - name: offerAllowed
    column: offer_allowed
    db_type: BOOLEAN
    java_type: Boolean
    nullable: false
    default: false
    source: design
    evidence: '미판매 상품 상세(2825:58233)의 ''구매 제안 O'' / ''구매 제안 X''. 판매 등록과 무관하게 아이템에 붙는다 (DEC-024)'
  - name: wishCount
    column: wish_count
    db_type: INT
    java_type: Integer
    nullable: false
    default: 0
    source: design
    evidence: '''관심 5명''. 판매 등록 전 아이템도 위시에 담기므로 아이템이 갖는다. 비정규화 카운터이며 정본은 wishlist (→ 파생 컬럼 대장, DEC-024)'
  - name: deletedAt
    column: deleted_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: design
    evidence: '''삭제된 아이템'' 상태. soft delete'
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  - name: updatedAt
    column: updated_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: design
    evidence: '''상세 수정'''
  indexes:
  - name: ix_item_category
    columns:
    - category_id
    - deleted_at
    unique: false
    note: category_id 가 등치 조건이라 앞에 둔다
  - name: ix_item_registrant
    columns:
    - registrant_id
    - deleted_at
    unique: false
  - name: ix_item_sale_status
    columns:
    - sale_status
    - deleted_at
    unique: false
    note: 검색 필터의 판매 상태 3모드(2825:38802). DEC-026 으로 상태가 아이템에 오면서 item_listing 조인이 사라졌다
  constraints:
  - rule: 판매 중이거나 진행 중 거래가 있으면 삭제 불가
    enforced_by: application
    source: inferred
    evidence: 거래 무결성. 화면에 명시 문구는 없음
  - rule: 'sale_status 전이는 네 곳에서만 일어난다 — 판매 전환(→ON_SALE) · 미판매로 변경(→NOT_FOR_SALE) · 결제 완료(→SOLD) · 거래 취소(→NOT_FOR_SALE). 판매 완료로 변경 메뉴는 수동 SOLD 다'
    enforced_by: application
    source: design
    evidence: 메뉴 모달(2825:59974)의 '미판매로 변경하기'·'판매 완료로 변경하기' + 목록(2825:52336)의 '판매 전환' 버튼 (DEC-026)
    amended: 거래 취소는 ON_SALE 로 복구하지 않고 NOT_FOR_SALE 로 보낸다. item_listing.close() 는
      DEC-026 에 따라 닫힌 행을 다시 열지 않으므로(재오픈 메서드 자체가 없음), ON_SALE 로 되돌리면
      열린 item_listing 없이 ON_SALE 인 깨진 상태가 된다 — 바로 아래 제약과 충돌한다.
      재판매는 판매 전환을 다시 거쳐 새 item_listing 을 만들어야 한다(order 도메인 구현, 2026-10-05)
  - rule: sale_status=ON_SALE 이면 closed_at 이 비어 있는 item_listing 이 정확히 1개 있어야 한다
    enforced_by: application
    source: inferred
    evidence: 판매 중 상세가 가격·배송비·수수료 부담을 그리려면 열린 판매 등록이 있어야 한다 (DEC-026)
