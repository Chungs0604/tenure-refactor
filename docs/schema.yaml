    evidence: 사용자 지정 사양 — 하의 규칙
  - rule: 치마 — 허리 단면·엉덩이 단면·밑단·총 기장만 받는다. 어깨·가슴·소매·허벅지·밑위·인심 6개는 NULL 이어야 한다. 받는 항목은 선택이다
    enforced_by: application
    source: design
    evidence: 사용자 지정 사양 — 치마 규칙
  - rule: 신발·가방·모자·액세서리·주얼리 — 실측 입력 자체가 금지. item_measurement 행을 만들지 않는다. 한 칸도 안 채운 경우도 행을 만들지 않는다
    enforced_by: application
    source: design
    evidence: 사용자 지정 사양 — 실측 미적용 카테고리
  - rule: 판정 기준은 대분류(category.depth=1)의 measurement_scheme 이다. 세부 카테고리는 보지 않는다 — 데님 팬츠·슬랙스·레깅스 모두 하의 6종. 이름으로 판정하지 않는다(DEC-027) — 표기가 두 번 바뀐 전례가 있다(주얼리→쥬얼리, 긴팔→긴소매)
    enforced_by: application
    source: design
    evidence: 사용자 지정 사양 — 판정은 대분류 이름으로만
