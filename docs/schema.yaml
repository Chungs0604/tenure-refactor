# Tenure DB 스키마 정본 (machine-readable) — v10
# v10: 대분류별 실측 항목 세트를 category.measurement_scheme 으로 올렸다(DEC-027).
# v9: 판매 상태를 item 으로 올리고 item_listing 을 판매 조건 스냅샷으로 좁혔다(DEC-026).
#     trade_order.listing_id 가 nullable 이 되어 미판매 아이템의 거래가 성립한다.
# v8: 사이즈 칩 목록을 size_option 테이블로 옮기고 Q6 를 닫았다(DEC-025).
# v7: 공개 노출 속성(wish_count · offer_allowed)을 item_listing 에서 item 으로 올렸다(DEC-024).
# v6: 목록 페이지네이션을 커서로 통일하고(DEC-022) 검색 추천 순의 정렬 키를 확정했다(DEC-023).
# v5: 47개 화면을 전수 재판독해 30건을 바로잡았다. 경위는 docs/design-audit.md
# 생성: figma-to-erd 규격. docs/erd.md 의 관계 요약표·화면 인벤토리·컬럼 명세 표는 이 파일에서 생성된다.

