  master: post (deleted_at IS NULL)
  update: 게시·삭제 트랜잭션 내 증감
  reason: 같은 목록에 함께 노출된다
- column: post.like_count
  master: post_like
  update: 좋아요·취소 트랜잭션 내 증감
  reason: OOTD 상세의 '♡ 1234'. 피드에서 게시물마다 필요
- column: post.save_count
  master: post_save
  update: 저장·취소 트랜잭션 내 증감
  reason: OOTD 상세의 '🔖 1234'
- column: item.wish_count
  master: wishlist
  update: 관심 등록·해제 트랜잭션 내 증감
  reason: 상품 상세의 '관심 14명'. 판매 등록 전 아이템도 위시에 담기고 판매를 내렸다 다시 걸어도 수가 유지돼야 해서 item 이 갖는다 (DEC-024)
- column: item.sale_status
  master: item_listing (열린 행의 유무) + trade_order (결제 완료 여부)
  update: 판매 전환·미판매로 변경·결제 완료·거래 취소 네 지점에서 같은 트랜잭션 안에 쓴다
  reason: |
    엄밀히는 파생이지만 컬럼으로 둔다. 배지를 그리는 화면이 내 옷장·위시리스트·태그 시트·
    검색 결과·아이템 상세로 다섯이고, 파생으로 두면 그 전부가 item_listing 과 trade_order 를
    함께 조인해야 한다. 판매 등록이 한 번도 없던 아이템의 '판매 완료'(3465:33567)는 조인으로는
    item_listing 을 거치지도 못한다 (DEC-026)
- column: post.view_count
  master: Redis post-view:{postId}
  update: 조회 시 Redis INCR, 주기 배치가 컬럼에 더한다
  reason: 검색 결과의 '조회수 순' 정렬. 조회마다 UPDATE 하면 인기 게시물에 쓰기가 몰린다 (DEC-019)
- column: post.rank_score
  master: post_like · post_save · post.view_count · post.created_at
  update: 배치가 60분마다 계산해 덮어쓴다
  reason: 검색 '추천 순'의 정렬 키(DEC-023). 조회할 때마다 계산하면 정렬이 인덱스를 못 타고, 요청 사이에 값이 바뀌어 커서 경계가 흔들린다(DEC-022)
- column: chat_room.last_message_at
  master: MAX(chat_message.created_at)
  update: 메시지 쓰기 트랜잭션 내 동기 갱신
  reason: 채팅방 목록 정렬. 매번 MAX 를 구하면 방이 늘수록 비싸진다
- column: item_wear_record.worn_date
  master: post.worn_date
  update: 복제하지 않음 — 스냅샷
  reason: 파생이 아니라 인증 시점의 값 고정. 질문 대상이 아니다
- column: user_grade_history.valid_ootd_count
  master: 평가 시점의 판정 결과
  update: 복제하지 않음 — 스냅샷
  reason: 재계산하면 그 사이 삭제된 게시물 때문에 값이 달라진다. 승격·강등 판정의 근거값이므로 당시 수치를 고정한다. 파생이 아니라 질문 대상이 아니다
design_decisions:
- id: DEC-001
  topic: 아이템 마스터(product) 테이블을 두지 않는다
  considered:
  - product 마스터 테이블 도입
  - 아이템만 두고 마스터 없이 간다
  decision: 현행 유지
  rationale: 태그는 본인이 보유한 아이템에만 달 수 있으므로 AI 유사도 탐색 범위가 본인 옷장으로 한정된다. 동일 모델 식별이 태그 목적에는 불필요해져 마스터 상품의 근거가 사라졌다
  revisit_when: '''이 모델의 모든 매물'' 같은 교차 사용자 탐색 화면이 생기면 재검토한다'
- id: DEC-002
  topic: 유효 OOTD 판정을 비정규화하지 않는다
  considered:
  - post.has_item_tag 비정규화 컬럼
  - EXISTS 서브쿼리
  decision: EXISTS 서브쿼리 유지
  rationale: 판정 범위가 한 사용자의 직전 30일로 좁고 ix_post_author_created 가 받아준다. post.has_item_tag 를 두면 태그 변경 경로마다 갱신을 빠뜨릴 위험이 생긴다
- id: DEC-003
  topic: 공휴일 판단
  considered:
  - 공공 API + Redis 캐시
  - holiday 마스터 테이블
  - 애플리케이션 메모리 캐시
  decision: 공공 API 연동 + Redis 캐시
  rationale: 대체공휴일·임시공휴일이 매년 바뀌어 holiday 마스터 테이블은 매년 운영 부담이 된다. ERD 에는 테이블을 만들지 않는다. 캐시는 Redis 에 둔다 — 키 `holiday:{yyyy}` 에 그 해의 공휴일 목록을 담고 TTL 을 건다. DEC-009·DEC-010 과 같은 기준이다(TTL 휘발 데이터는 RDB 에 두지 않는다). 애플리케이션 메모리 캐시는 인스턴스가 늘면 각자 외부 API 를 치게 되고, 스택에 이미 Redis 가 있어 캐시 방식을 둘로 둘 이유가 없다
  revisit_when: 외부 API 장애로 정산 배치가 멈추는 사고가 나면 캐시 테이블 도입을 검토한다
- id: DEC-004
  topic: 탈퇴 처리
  considered:
  - 탈퇴 즉시 익명화 + 즉시 재가입 허용
  - 유예 기간 후 파기
  - 물리 삭제
  decision: 탈퇴 즉시 익명화 + 즉시 재가입 허용
  rationale: email 은 withdrawn_{id}@deleted.local 로, phone·real_name 은 마스크로 치환하고 nickname 은 탈퇴한사용자_{id} 로 바꾼다. user 행과 FK 는 유지되어 Tenure 기록 기준의 이전 소유자 표시가 남는다. 거래 기록은 order_shipment·settlement 의 스냅샷으로 보존된다
- id: DEC-005
  topic: 설정의 기본 배송비 기능
  considered:
  - user.default_shipping_fee 컬럼 추가
  - 이번 범위에서 제외
  decision: 범위에서 제외하고 설정 화면의 메뉴도 지운다
  rationale: user.default_shipping_fee 컬럼을 만들지 않는다. 그 결과 미판매 아이템 구매 제안의 배송비는 항상 0원(판매자 부담)이 된다. 설정 화면에 '기본 배송비'·'수수료 부담 기본값'·'구매 제안 받기 기본값' 메뉴 3종이 있으나 상세 화면이 없었고, 확인 결과 기능을 만들지 않기로 했다 — 들어갈 수 없는 메뉴를 남겨두면 사용자가 누르고 빈 화면을 본다. **디자인에서 메뉴를 삭제한다**
  revisit_when: 2026-09-28 확정 — 기능을 만들지 않고 메뉴를 지운다. listing·offer 의 금액 규칙이 이 결정 위에 서 있으므로(미판매 제안 배송비 0원), 나중에 기능을 되살리려면 그 제약부터 다시 본다
- id: DEC-006
  topic: 이미지 저장소
  considered:
  - S3 전용
  - 로컬 파일시스템 전용
  - 설정값으로 전환(local | s3)
  decision: 로컬 + S3, 설정값으로 전환
  rationale: 'app.storage.type(STORAGE_TYPE 환경변수)으로 LocalFileStorage / S3FileStorage 를 고른다. 개발자는 AWS 자격증명 없이 로컬 파일시스템으로 돌리고, 배포 시 환경변수만 바꾼다. global/storage/FileStorage 인터페이스 뒤에 두 구현을 @ConditionalOnProperty 로 배치해 런타임 분기가 없다. 이미지 컬럼(*_image_key)에는 저장소와 무관한 **키**(예: post/2026/03/ab12.jpg)를 넣고, 조회 시 FileStorage.toUrl() 이 현재 설정의 base-url 을 붙인다. 전체 URL 을 저장하면 로컬에서 넣은 데이터를 운영에 올릴 때 URL 이 깨지고 도메인 변경 시 전수 마이그레이션이 필요하다'
  revisit_when: CDN 을 붙이면 app.storage.s3.base-url 만 바꾼다. 스키마 변경은 필요 없다
- id: DEC-007
  topic: 최초 소유 구간의 start_date
  considered:
  - 수정 불가로 고정
  - item.first_owned_date 로 채우고 거래 전까지만 수정 허용
  - ownership 과 완전 분리
  decision: item.first_owned_date 로 채우고 등록 뒤에는 누구도 수정할 수 없다 (2026-09-30 재검토)
  rationale: |
    화면의 'Tenure 기록 기준' 첫 구간과 '최초 보유 날짜'가 같은 값으로 보이므로 둘을 일치시킨다.
    처음에는 '거래 전까지만 수정 허용' 으로 열어 뒀는데, item 을 구현하며 두 가지가 걸렸다.
      1. 잠긴 상태의 화면이 어디에도 없다. 상세 수정 바텀시트 9종에 '최초 보유 날짜' 입력란이
         평범한 편집 필드로 그려져 있고(상의만 그 칸이 없다), 거래 후 비활성 상태는 그려져 있지 않다.
         조건부 수정을 유지하려면 그 화면을 새로 그리고 프론트가 조건을 판정해야 한다.
      2. append-only 테이블에 예외가 둘이 된다 — 구간 종료와 start_date 정정. 0순위 테이블에
         허용 UPDATE 가 많을수록 규칙이 흔들린다.
    막는 쪽을 택했다. '등록 시점에 정해지고 그 뒤로는 불변' 이면 화면도 판정도 필요 없고,
    item_ownership 의 허용 UPDATE 가 '거래 완료 시 end_date 를 닫는다' 하나로 줄며,
    'Tenure 기록은 사후에 바뀌지 않는다' 가 조건 없이 성립한다.
    대가는 등록 시 오타가 영구라는 것이다 — 선택 입력이므로 애매하면 비우도록 안내한다.
  revisit_when: 등록 직후 짧은 정정 창(첫 인증이 적립되기 전 등)을 열고 싶어지면 그때 다시 본다. 그 경우에도 거래가 한 번이라도 있었으면 잠근다
- id: DEC-008
  topic: 운송장 번호 정정
  considered:
  - order_shipment_history 이력 테이블 도입
  - 재입력 허용·이력 미보관
  - 정정 불가
  decision: 배송 완료 전까지 재입력 허용, 이력 미보관
  rationale: 형식 검증을 통과한 틀린 번호를 구제하되 DELIVERED 이후에는 잠근다. 이력 테이블을 두지 않아 이전 번호는 추적할 수 없다 — 지금 규모에서 테이블 하나를 더 두는 비용이 이득보다 크다고 봤다
  revisit_when: 배송 분쟁이 실제로 발생해 이전 운송장 추적이 필요해지면 order_shipment_history 를 추가한다
- id: DEC-009
  topic: 이메일 인증번호·토큰의 저장소
  considered:
  - Redis
  - RDB 테이블(email_verification)
  - JWT 자체 서명
  decision: Redis (RDB 테이블 없음). 1회용은 GETDEL 로 보장
  rationale: 인증번호(3분)와 인증 토큰(10분)은 TTL 이 있는 휘발 데이터다. DEC-010 이 refresh token 에 적용한 기준을 그대로 적용한다 — RDB 에 두지 않는다. 키는 `email-verify:{purpose}:{email}` 에 인증번호와 인증 여부를, `email-verify-token:{token}` 에 대상(purpose, email)을 담고 각각 TTL 을 건다. (1) 만료가 TTL 로 끝나 정리 배치가 필요 없다 (2) 재발급은 SET 덮어쓰기라 이전 것이 자동으로 무효화된다 (3) (email, purpose) 당 1행 제약을 키 구조가 강제한다 (4) 1회용은 GETDEL 이 조회와 삭제를 원자적으로 처리해 consumed_at 플래그 자체가 필요 없다. JWT 자체 서명은 재사용을 막을 수 없어 배제한다 — 비밀번호 재설정 토큰이 유출되면 수명 내내 반복 변경이 가능해진다. purpose 를 키에 넣어 SIGN_UP 토큰으로 PASSWORD_RESET 을 수행하지 못하게 막는다
  supersedes: 최초 설계는 email_verification 테이블이었다. DEC-010 과 같은 성격의 데이터인데 저장소 결정이 엇갈려 있었고, V3 에서 테이블을 제거했다
  revisit_when: 인증번호 발송 횟수 제한이나 어뷰징 추적처럼 이력을 남겨야 하는 요구가 생기면 별도 테이블을 검토한다. 인증 자체는 Redis 에 둔 채 시도 기록만 쌓는 편이 낫다
- id: DEC-010
  topic: refresh token 저장소
  considered:
  - Redis
  - RDB 테이블(refresh_token)
  - JWT 자체 서명만
  decision: Redis (RDB 테이블 없음)
  rationale: refresh token 은 TTL 이 있는 휘발 데이터이므로 RDB 에 두지 않는다. 키 `refresh:{userId}:{tokenId}` 에 토큰과 만료를 담고 로그아웃 시 삭제해 무효화한다. API-001 의 keepLoggedIn 은 Redis TTL 을 늘리는 것으로 구현한다. JWT 자체 서명만 쓰면 로그아웃 시 무효화가 불가능해 유출된 토큰이 만료까지 살아있다
  revisit_when: 기기별 세션 목록·원격 로그아웃 같은 화면이 생기면 RDB 테이블 도입을 재검토한다
- id: DEC-013
  topic: 거래 시점 값을 스냅샷하는 기준
  considered:
  - FK 로 원본을 참조
  - 값을 복사(스냅샷)
  - 복사와 FK 를 함께 둔다
  decision: 값을 복사한다. 원본을 FK 로 참조하지 않는다
  rationale: 거래는 체결 시점의 조건으로 고정되어야 한다. 원본(배송지·정산계좌·판매가·수수료 요율)은 사용자가 나중에 고치거나 지울 수 있어 FK 로 묶으면 과거 거래가 사후에 달라지거나 삭제가 막힌다. 복사 시점은 그 값이 거래 조건으로 확정되는 순간이다 — purchase_offer 는 제안 전송 시점(요율·수수료), order_shipment 는 제안 전송 시점(배송지), trade_order 는 수락 시점(금액), settlement 는 구매 확정 시점(계좌). item_wear_record.worn_date 는 태그 생성 시점의 post.worn_date 다. 복사한 컬럼에는 FK 를 걸지 않는다 — 걸면 스냅샷의 목적이 사라진다
  revisit_when: 스냅샷 컬럼을 새로 추가할 때 이 기준의 어느 시점에 해당하는지 먼저 정한다. 해당하는 시점이 없으면 스냅샷이 아니라 파생 컬럼일 수 있다
- id: DEC-014
  topic: 최근 본 게시물·사용자의 저장소
  considered: [Redis Sorted Set, RDB 테이블 + 사용자당 건수 상한, RDB 테이블 + 보관 기간 배치]
  decision: Redis Sorted Set (RDB 테이블 없음)
  rationale: 열람 이력은 다시 볼 일도 남길 이유도 없는데 RDB 에 영구 보관되고 있었다 — 보관 정책이 아예 없었다. 게다가 게시물·프로필을 조회할 때마다 쓰기가 일어나 읽기 경로에 쓰기가 붙은 구조다. Sorted Set 이 기존 동작을 그대로 한다 — 키 `recent-view:{userId}:{targetType}` 에 score 를 열람 시각으로 두면 ZADD 가 재열람 시 score 만 갱신해 uk(user_id, target_type, target_id) 와 같고, ZREVRANGE 로 최근 N건을 읽고 ZREMRANGEBYRANK 로 상한을 유지한다. 구조가 보관 정책을 대신하므로 기간을 따로 정할 필요가 없다. DEC-003·DEC-009·DEC-010 과 같은 기준이다
  supersedes: 최초 설계는 recent_view 테이블이었다. 삭제 정책을 C(하드 삭제)로 분류해놓고 지우는 경로를 정하지 않아 api-spec 의 CRUD 표에 보관 정책 없음 으로 남아 있었다. V4 에서 테이블을 제거했다
  revisit_when: 열람 이력으로 추천 모델을 학습시키는 등 장기 보관이 필요해지면 별도 저장소를 검토한다. 화면에 쓰는 최근 목록은 그때도 Redis 에 둔다
- id: DEC-015
  topic: 알림의 보관 기간
  considered: [90일 경과 삭제, 사용자당 최근 200건 유지, 보관 정책을 두지 않음]
  decision: 90일 경과 삭제 (배치)
  rationale: 알림은 읽음 상태와 탭별 페이징이 있어 RDB 가 맞다 — 여기까지는 recent_view 와 다르다. 다만 UNIQUE 제약이 없어 거래·제안·팔로우·위시 이벤트마다 행이 쌓이고 지우는 경로가 없어 무한히 증가했다. 화면이 어제 · 10월 24일 수준의 최근성을 보여주므로 90일이면 체감 손실이 없다. 건수 상한은 거래가 몰린 날 오래된 알림이 기간과 무관하게 밀려나서 택하지 않았다
  revisit_when: 운영 데이터를 확보한 뒤 실제 조회 분포를 보고 기간을 조정한다. 알림량이 예상보다 많으면 읽은 것과 안 읽은 것의 기간을 나누는 안을 검토한다
- id: DEC-016
  topic: 기본 배송지 단일성을 무엇으로 지킬 것인가
  considered:
  - 애플리케이션 순서(해제 → 지정)만으로 지킨다
  - 사용자 단위 비관적 락
  - DB 유니크 제약(함수 인덱스)
  decision: DB 유니크 제약. MySQL 은 부분 유니크가 없어 함수 인덱스로 건다
  rationale: '순서만으로는 동시 요청에서 둘 다 기본이 될 수 있었다. 락은 앞으로 is_default 를 건드리는 모든 코드가 기억해야 하지만 제약은 잊어도 깨지지 않는다 — follow 의 CHECK 제약과 같은 기준이다. UNIQUE ((IF(is_default, user_id, NULL))) 로 걸면 유니크 인덱스가 NULL 중복을 허용하므로 비기본은 몇 개든 쌓이고 기본만 사용자당 1건으로 묶인다. (user_id, is_default) 복합 유니크는 비기본을 2개 이상 못 갖게 돼 쓸 수 없다. 해제는 즉시 실행되는 벌크 UPDATE 로 내보낸다 — Hibernate 가 flush 시 INSERT 를 UPDATE 보다 먼저 실행해 엔티티로 해제하면 새 기본이 먼저 들어가 인덱스에 걸린다. 그 벌크 UPDATE 가 현재 기본 행에 X 락을 잡아 직렬화 게이트를 겸하므로 별도 락이 필요 없다 — 동시 요청이 모두 성공하고 유니크 위반이 나지 않음을 실측으로 확인했다. 제약은 게이트가 없는 극단에서의 최후 방어다'
  revisit_when: 정산 계좌(payout_account)에도 같은 함수 인덱스를 적용했다(uk_payout_account_default). 다른 점은 0건이 정상이라 '최대 1건'이라는 것뿐이다. 유니크 위반이 실제로 관측되면 DataIntegrityViolationException 핸들러를 둔다 — 지금은 전용 핸들러가 없어 500 이 된다
- id: DEC-017
  topic: 소셜 로그인(구글·네이버)
  considered:
  - 범위 밖으로 두고 아이콘을 무시한다
  - provider 컬럼만 열어두고 구현은 나중에
  - 설계에 포함한다
  decision: 설계에 포함한다
  rationale: 로그인 화면(2791:15250)에 구글·네이버 아이콘이 실재하는데 스키마·명세·제외 근거 어디에도 없었다 — 누락이다. user 에 provider(LOCAL|GOOGLE|NAVER)·provider_id 를 두고 uk_user_provider 로 같은 소셜 계정의 중복 가입을 막는다. 소셜 가입은 비밀번호가 없으므로 password_hash 를 nullable 로 바꾼다. 모바일 앱이 제공자 SDK 로 받은 토큰을 서버에 넘기고 서버가 검증하는 방식을 쓴다 — 웹 리다이렉트 콜백은 앱에서 흐름이 번거롭다
  revisit_when: 애플 로그인이 추가되면 enum 에 APPLE 을 더한다. iOS 심사는 소셜 로그인이 있으면 애플 로그인을 함께 요구한다
- id: DEC-018
  topic: 가입 플로우에 실명·휴대폰 입력 화면이 없는 문제
  considered:
  - 화면 누락으로 보고 NOT NULL 을 유지한다
  - nullable 로 바꾸고 첫 거래 때 채운다
  - 휴대폰 본인인증을 가입 단계에 넣는다
  decision: 화면 누락이 맞다 — 프로필 작성 단계에서 실명·휴대폰을 함께 받는다
  rationale: 회원가입 4단계(계정 생성 → 동의 → 주소 등록 → 프로필 작성) 어디에도 실명·휴대폰 입력란이 없는데 로그인 정보 화면(3063:28514)은 두 값을 표시한다. 가입 중 주소 등록도 주소·상세주소만 받아 shipping_address 의 수령인·연락처·우편번호를 채울 수 없다. 디자인이 덜 그려진 것으로 판단하고 스키마를 유지한다 — 값을 nullable 로 열면 로그인 정보 화면이 빈칸을 보여주고 배송에 필요한 연락처가 없는 주문이 생긴다. **프론트가 가입 단계에 입력란을 추가해야 한다**
  revisit_when: 2026-09-28 확정 — 가입 4단계 중 '프로필 작성'(2791:17395)에 실명·휴대폰 입력란을 추가한다. 닉네임·성별·키·몸무게와 같은 화면에서 받으므로 단계 수는 늘지 않는다. 스키마와 API-012 는 그대로다. 소셜 로그인(DEC-017)은 제공자가 실명을 주므로 그 값으로 미리 채운다
- id: DEC-019
  topic: 게시물 조회수를 어디에 쌓을 것인가
  considered:
  - post.view_count 에 조회할 때마다 직접 UPDATE
  - Redis 카운터로 받고 주기적으로 post.view_count 에 반영
  - 조회수 순 정렬을 빼고 컬럼을 두지 않는다
  decision: Redis 카운터 + 주기적 반영. 정렬은 post.view_count 로 한다
  rationale: 검색 결과(2825:39649)의 정렬이 5종이고 그중 '조회수 순'이 있어 컬럼 없이는 구현할 수 없다. 다만 조회할 때마다 UPDATE 하면 인기 게시물 한 행에 쓰기가 몰리고 읽기 경로에 락 경합이 생긴다. 키 `post-view:{postId}` 에 INCR 로 모았다가 배치가 컬럼에 더한다 — DEC-014 가 최근 열람을 Redis 로 옮긴 것과 같은 기준이다(읽기 경로에 DB 쓰기를 붙이지 않는다). 정렬은 컬럼을 읽으므로 인덱스를 태울 수 있고, 값이 몇 분 늦는 것은 조회수 정렬에서 문제가 되지 않는다
  revisit_when: 실시간성이 필요해지면 반영 주기를 줄인다. 어뷰징(같은 사용자의 반복 조회)이 관측되면 Redis 키에 사용자 구분을 더한다
- id: DEC-020
  topic: 검색창의 '추천 검색어'를 무엇으로 채울 것인가
  considered:
  - search_history 를 집계한 인기 검색어
  - 운영이 관리하는 고정 목록 테이블
  - 애플리케이션 상수
  decision: search_history 집계 (인기 검색어)
  rationale: 검색창을 누르면 '데님 팬츠'·'나이키 신발'·'Levis 501'·'가죽 자켓' 칩이 뜬다(2820:34830). 고정 목록 테이블은 관리자 기능을 범위 밖으로 둔 것과 충돌한다 — 값을 넣을 화면이 없어 DB 직접 입력이 된다. 집계는 운영 손이 들지 않고 데이터가 쌓일수록 좋아진다. 최근 N일 keyword 별 건수 상위를 뽑아 Redis 에 캐시하고 TTL 을 건다 — 매 요청 집계하면 search_history 전체를 스캔한다
  revisit_when: 초기에는 검색 기록이 없어 칸이 빈다. 서비스 초반에 노출이 필요하면 상수 목록을 폴백으로 두는 안을 검토한다
- id: DEC-021
  topic: 화면 드롭다운의 선택지를 API 로 내릴 것인가 클라이언트가 가질 것인가
  considered:
  - 모든 enum 의 선택지를 API 로 내린다
  - 모든 선택지를 클라이언트가 하드코딩한다
  - 값이 앱 배포와 무관하게 늘 수 있는 것만 API 로 내린다
  decision: 값이 앱 배포와 무관하게 늘 수 있는 것만 API 로 내린다
  rationale: 은행 목록(API-035)을 만들면서 기준 없이 정했더니 같은 성격인 택배사가 빠졌다. 기준은 '값이 앱 배포와 무관하게 늘어나는가'다. 은행·택배사는 서버가 enum 을 늘려도 앱이 따라오지 못하면 화면이 낡는다 — API 로 내린다. 성별·수수료 부담·결제 수단·상태 이상 체크·배송 요청사항·탈퇴 사유는 값이 고정이고 화면 문구가 디자인에 박혀 있어 클라이언트가 갖는다. 표시 문구가 길어 화면에 그대로 쓰이는 것(알림 설정 9종의 제목·설명·그룹 헤더)은 값이 고정이어도 그 문구를 함께 내린다 — 클라이언트가 두 줄짜리 문구 9개를 복제하면 문구 수정이 배포에 묶인다
  revisit_when: enum 을 새로 만들 때 이 기준으로 판정한다. 관리자 화면이 생겨 운영이 목록을 바꾸게 되면 그 enum 은 마스터 테이블로 옮긴다
- id: DEC-022
  topic: 목록 페이지네이션 방식
  considered:
  - offset(page·size) + 총 건수
  - 커서(cursor·size)
  - 화면마다 다르게
  decision: 커서로 통일한다. 총 건수는 검색 결과에만 싣는다
  rationale: 47개 화면에 페이지 번호 UI 가 하나도 없다 — 전부 아래로 스크롤한다. 그런데 응답은 page·totalElements·totalPages 를 싣고 있었고, 그 값을 쓰는 화면은 검색 결과의 '총 게시물 80개' 하나뿐이었다. 즉 목록마다 아무도 안 쓰는 count 쿼리를 한 번씩 더 치고 있었다. 게다가 offset 은 스크롤 중에 새 게시물이 앞에 들어오면 페이지가 밀려 같은 항목이 두 번 보이거나 한 건이 빠진다. 커서는 '어디까지 줬는지'를 값으로 기억해 그 일이 없고, size+1 건을 읽어 다음 페이지 유무를 알므로 count 가 사라진다. 커서는 정렬 키와 id 를 담은 불투명 문자열(base64)이며 암호화하지 않는다 — 담긴 값이 이미 응답에 실려 나가는 값이라 숨길 것이 없고, 목적은 클라이언트가 형식을 알고 직접 만들지 못하게 하는 것이다. 정렬 키가 겹칠 때를 대비해 항상 id 로 tie-break 한다
  revisit_when: 총 건수를 표시하는 화면이 더 생기면 그 엔드포인트에만 검색과 같은 방식으로 totalCount 를 더한다. 규격을 offset 으로 되돌리지 않는다
- id: DEC-023
  topic: 검색 '추천 순'의 정렬 기준
  considered:
  - 조회 시점에 점수를 계산한다
  - 사전 계산한 rank_score 컬럼 + 배치
  - 매칭 등급 + 최신순만
  decision: 매칭 등급(쿼리 시점) → post.rank_score(배치 사전 계산) → id 순으로 정렬한다
  rationale: |
    키워드는 게시물이 아니라 태그된 아이템과 매칭된다 — post 에 캡션 컬럼이 없어 게시물 자체에는
    텍스트가 없다. 매칭 등급은 3(브랜드+모델명) / 2(브랜드 또는 아이템명) / 1(카테고리명) / 0(제외)이다.
    같은 등급 안에서는 rank_score 로 가른다.
      rank_score = log10(1 + save*3 + like*1 + view*0.2) * 0.6 + exp(-경과일/14) * 0.4
    저장에 가장 큰 가중치를 준 이유는 '나중에 사겠다'는 신호이기 때문이고, 조회수는 어뷰징에 가장 약해
    가중치를 낮췄다. log 를 씌운 것은 인기 게시물의 상위 고착을 막기 위해서다 — 새 게시물이 노출을
    못 받으면 피드백 루프에 갇힌다. 점수를 배치로 미리 계산하는 이유는 (1) 함수 결과로 정렬하면
    인덱스를 태울 수 없고 (2) 요청 사이에 값이 바뀌면 커서 경계가 흔들리기 때문이다(DEC-022).
    키워드 없이 필터만 적용한 경우는 등급이 전부 0 이라 rank_score 만으로 정렬된다 — 사실상
    '지금 인기 있는 스타일'과 같은 성질이 된다.
  revisit_when: 개인화 가산점(팔로우 중인 작성자·내 체형과 비슷한 작성자)은 넣지 않았다. 사용자별 점수가 되어 사전 계산이 불가능해지고 정렬 이상을 디버깅하기 어려워진다. 클릭 로그가 쌓여 효과를 측정할 수 있게 되면 재검토한다. 가중치와 배치 주기도 그때 조정한다
- id: DEC-024
  topic: 관심 수와 구매 제안 허용을 어느 테이블에 두는가
  considered:
  - item_listing 에 그대로 둔다 (기존)
  - 아이템 등록 시 item_listing 을 NOT_FOR_SALE 로 함께 만든다
  - item 으로 올린다
  decision: wish_count 와 offer_allowed 를 item 으로 올리고 item_listing 은 판매 조건만 갖는다. purchase_offer.listing_id 는 nullable 로 바꾼다
  rationale: |
    item_listing 은 성격이 다른 둘을 함께 담고 있었다 — 공개 노출 속성(관심 수·구매 제안 허용)은
    아이템과 수명이 같고, 판매 조건(가격·배송비·수수료 부담·판매자 설명)은 판매할 때만 산다.
    item_listing 은 재판매마다 새 행이 생기는 1:N 이라 공개 속성을 여기 두면 세 가지가 깨진다.
      1. 갓 등록한 아이템은 listing 이 없어 관심을 받을 곳이 없다. 그런데 wishlist 는
         '판매 등록 전 아이템도 담을 수 있어야 한다'가 전제이고 위시리스트 화면에 '미판매' 배지가 있다
      2. OfferType.PURCHASE_OFFER 의 정의가 '미판매 제품에 대한 구매제안'인데
         purchase_offer.listing_id 가 NOT NULL 이라 보낼 대상이 없었다
      3. 판매를 내렸다 다시 걸면 새 listing 행이 생겨 관심 수가 0 으로 리셋된다
    화면 근거는 미판매 상품 상세(2825:58233)다 — '관심 5명'과 '구매 제안 O/X' 를 함께 그리고,
    구매제안 on(2825:57652)에는 하단에 '구매제안하기' CTA 가 붙고 off(2825:57760)에는 없다.
    '등록 시 listing 을 함께 만든다'는 택하지 않았다. item_listing 생성 전제가 판매자에게
    정산 계좌가 있는 것이라, 정산 계좌 없는 사용자가 아이템 등록조차 못 하게 된다.
    chat_room.listing_id 가 이미 '미판매 아이템이면 NULL 가능' 이었으므로 방향은 일관된다.
    '미판매'는 두 경로(listing 행 없음 / 최신 listing 이 NOT_FOR_SALE)로 생기므로 API 응답에서는
    saleStatus 를 아이템 레벨로 평탄화해 하나로 내려준다
  superseded_by: 평탄화는 DEC-026 에서 sale_status 를 item 컬럼으로 올리며 사라졌다. 관심 수·구매 제안 허용을 옮긴 판단 자체는 유효하다
  revisit_when: 판매 중 아이템의 구매 제안 허용을 판매 등록별로 다르게 걸고 싶어지면 item_listing 에 재정의 컬럼을 더한다. item 의 값은 기본값으로 남긴다
- id: DEC-025
  topic: 카테고리별 사이즈 칩을 어디에 두는가 (Q6 해소)
  considered:
  - category.size_scheme 한 칸에 체계 이름을 넣는다 (기존)
  - 프론트가 칩 목록을 하드코딩한다
  - size_option 테이블을 만들고 size_label 을 검증한다
  decision: size_option 테이블을 신설한다. category.size_scheme 은 대분류에만 칩 세트 이름을 담고, item.size_label 은 문자열로 두되 등록·수정이 그 세트로 검증한다
  rationale: |
    category.size_scheme 은 VARCHAR 한 칸이라 체계를 하나만 담는데, 상세 수정 바텀시트를 열어 보니
    상의는 네 체계(XS~3XL · 85~115 · 36~50 · 0~6)를 한꺼번에 펼친다. 한 칸으로는 화면을 그릴 수 없다.
    게다가 그 칸이 세부 카테고리 102행에도 있어 어디가 정본인지 모호했다.
      TOP       상의 · 아우터 · 원피스   ALPHA 7 + KR_NUMERIC 7 + EU_NUMERIC 8 + FREE_NUMBER 7 = 29칩
      BOTTOM    하의 · 치마             ALPHA 7 + INCH 17 + FREE_NUMBER 7 = 31칩
      SHOE      신발                    MM 210~310 = 21칩
      ONE_SIZE  모자 · 가방 · 액세서리 · 쥬얼리  1칩
    칩 목록을 DB 에 두면 프론트가 하드코딩하지 않아도 되고, 체계를 고치는 일이 seed UPDATE 한 번으로
    끝난다. 또 백엔드가 size_label 을 검증할 수 있게 된다 — 칩에서 고르는 값인데 API 가 아무거나
    받으면 그 오타가 공개 페이지와 상품 상세에 그대로 박힌다. 기록으로 가치를 증명하는 서비스라
    아이템 원장의 품질이 중요하다.
    item.size_label 을 FK 로 묶지는 않았다. 사이즈 체계를 나중에 손보더라도 이미 등록된 아이템의
    기록이 흔들리면 안 된다 — 금액·배송지를 스냅샷으로 두는 것과 같은 이유다.
  revisit_when: 대분류 안에서 세부 카테고리마다 칩이 갈리는 화면이 생기면 category.size_scheme 을 depth=2 에도 채우고 '가장 가까운 조상' 규칙으로 읽는다. 테이블 구조는 그대로 쓸 수 있다
- id: DEC-026
  topic: 판매 상태(sale_status)를 어느 테이블에 두는가
  considered:
  - item_listing 에 그대로 둔다 (기존)
  - item_listing 에 두고 없는 경우는 trade_order 조인으로 판정한다
  - item 으로 올리고 item_listing 은 조건 스냅샷만 갖는다
  decision: sale_status 를 item 으로 올린다. item_listing 은 가격·배송비·수수료 부담·판매자 설명과 listed_at·closed_at 만 갖고, trade_order.listing_id 는 nullable 로 바꾼다
  rationale: |
    상태를 판매 등록 행이 들고 있으면 등록이 없는 아이템은 상태를 표현할 수 없다.
    그런데 화면에는 그런 아이템이 둘 있다.
      1. 미판매 공개 페이지(2825:58233) — 판매 전환을 한 번도 안 한 아이템에 '미판매' 배지가 붙는다
      2. 판매 완료 상세 - 미판매였던 아이템(3465:33567) — 미판매 아이템이 구매 제안으로 팔린 뒤의
         화면이다. listing 행이 없는데 '판매 완료'를 표시한다
    2번은 trade_order.listing_id 가 NOT NULL 이라 거래를 만드는 것부터 막혀 있었다 —
    purchase_offer.listing_id 만 nullable 로 바꾼 DEC-024 가 거기까지 따라가지 못했다.
    세 화면의 헤더가 전부 '아이템 상세'이고 판매중/미판매/판매완료가 한 화면의 상태 변형으로
    그려진다는 것이 결정적이다. 상태는 아이템의 것이고 item_listing 은 '어떤 조건으로 팔았는가'다.
    조인으로 판정하는 안은 택하지 않았다. 배지를 그리는 화면이 내 옷장·위시리스트·태그 시트·
    검색 결과·아이템 상세로 다섯인데 전부 두 테이블을 더 붙여야 하고, listing 도메인이 order
    도메인에 의존하게 된다. wish_count 를 이미 비정규화 컬럼으로 둔 것과 같은 판단이다.
    SOLD 로 넘어가는 시점은 결제 완료(판매자의 제안 수락)다. CLAUDE.md 가 '제안 시 승인 →
    판매자 수락 시 확정(captured_at)'이므로 수락하는 순간 돈이 빠져나가고 그 아이템은 더 살 수
    없다 — '판매 완료' 배지가 뜻하는 바와 시점이 같다. 구매 확정은 타임라인 4단계(정산 직전)라
    그때까지 ON_SALE 로 두면 4~7일 동안 남들 눈에 판매중으로 보인다. 발송 전 거래 취소(API-166)
    시에는 ON_SALE 로 되돌린다.
    수락~확정 사이의 '거래중'은 enum 값으로 두지 않는다. 배지는 화면에 3종뿐이고 거래중은
    위시리스트 탭(2825:45934)에만 있으므로 trade_order 조인으로 파생시킨다(A-10 과 같다)
  revisit_when: 거래중을 배지로도 그리게 되면 SaleStatus 에 IN_TRADE 를 더한다. 그때는 위시리스트 탭의 조인도 이 값으로 대체된다
- id: DEC-027
  topic: 실측 항목 세트(어느 대분류가 무엇을 받는가)를 어디에 두는가
  considered:
  - size_scheme 으로 겸한다
  - 대분류 id 를 키로 자바 enum 에 하드코딩한다
  - category 에 measurement_scheme 컬럼을 신설한다
  decision: category.measurement_scheme 컬럼을 신설한다. 값은 TOP · BOTTOM · SKIRT · NONE 이고 대분류에만 채운다
  rationale: |
    size_scheme 으로는 갈라지지 않는다 — 하의와 치마가 둘 다 BOTTOM 인데 실측 항목이 다르다.
      하의  허리 단면 · 허벅지 단면 · 총 기장 · 밑위 · 인심 · 밑단      6개
      치마  허리 단면 · 엉덩이 단면 · 밑단 · 총 기장                  4개
    하드코딩을 택하지 않은 이유는 DEC-025 와 같다 — 판매 전환 화면(3342:32943)이
    '실측 입력 · 바지' 처럼 대분류별로 다른 입력란을 그리므로 프론트도 이 값이 필요하다.
    양쪽이 각자 표를 들고 있으면 카테고리가 늘 때 어긋난다. API-090 이 카테고리 트리와 함께
    내려주고 서버는 같은 값으로 검증한다.
    대분류 '이름' 으로 판정하는 안도 택하지 않았다. 표기가 이미 두 번 바뀌었다 —
    주얼리→쥬얼리(V11), 긴팔 티셔츠→긴소매 티셔츠(V14). 이름은 화면 문구라 또 바뀐다.
    세트에 없는 항목에 값이 오거나 세트의 항목이 비면 ITEM_400_MEASUREMENT 다. 원장 품질이
    중요한 서비스라 — 기록으로 가치를 증명한다 — 신발에 어깨 너비가 박히는 것을 막는다.
    API 의 실측은 **이름 붙은 10개 필드가 아니라 MeasurementField 를 키로 쓰는 맵**이다.
    대분류마다 쓰는 항목이 4~6개뿐이라 이름 필드로 두면 요청에도 응답에도 null 이 6개씩 낀다.
    맵으로 두면 보낸 것·돌려주는 것이 화면이 그리는 칸과 정확히 같아진다.
    대가는 스웨거다 — 항목별 한글 라벨(어깨 너비(cm))이 API 문서에서 사라지고 프론트가
    enum 값으로 라벨을 들고 있어야 한다. 어차피 API-090 을 먼저 부르는 화면이라 받아들였다.
    엔티티 팩토리도 맵을 받는다. 위치 인자 10개가 전부 BigDecimal 이면 둘을 바꿔 넣어도
    컴파일이 통과해서, 원장이 조용히 틀어지는 경로가 생긴다.
  revisit_when: 같은 대분류 안에서 세부 카테고리마다 실측이 갈리는 화면이 생기면 measurement_scheme 을 depth=2 에도 채우고 '가장 가까운 조상' 규칙으로 읽는다. size_scheme 과 같은 방식이다
- id: DEC-028
  topic: 채팅방 헤더의 '제안 금액'이 어느 purchase_offer 행을 가리키는가
  considered:
  - 그대로 둔다 (price 를 String 으로만 내려주고 서버 내부에서 매번 최신 제안을 조회)
  - chat_room 에 purchase_offer_id FK 를 추가한다
  - purchase_offer 쪽에 chat_room_id 를 두고 역방향으로 찾는다
  decision: chat_room.purchase_offer_id (nullable FK) 를 추가한다. listing_id 와 배타적으로 채운다 — 판매중 아이템 방은 listing_id, 미판매+제안 아이템 방은 purchase_offer_id
  rationale: |
    listing_id 는 '판매중' 방의 가격 출처고, 미판매+제안 방은 대응하는 컬럼이 없어 price 를
    어느 제안에서 가져오는지 스키마상 경로가 없었다. 같은 아이템에 재제안이 여러 번 쌓일 수
    있어 '최신 PENDING' 을 매번 정렬·조회로 찾는 방식은 N+1 과 레이스 컨디션(재제안과 조회가
    겹치는 순간)을 둘 다 만든다. FK 로 두면 재제안 시점에 한 번만 갱신하고 조회는 단순 join이 된다.
    역방향(purchase_offer.chat_room_id)을 택하지 않은 이유는 purchase_offer 가 append-only
    원장이기 때문이다 — 재제안마다 새 행이 생기는데 그중 '현재 유효한 것'을 가리키는 포인터는
    가변 상태를 가진 chat_room 쪽에 두는 것이 자연스럽다.
  revisit_when: 제안 이력을 채팅방에서 전부 펼쳐 보여주는 화면이 생기면 이 FK 하나로는 부족하고 chat_room_id 를 purchase_offer 에 두는 1:N 구조로 바꾼다
- id: DEC-101
  topic: 타인에게 보이는 프로필 필드 — 등급·키·몸무게는 공개, 성별은 비공개
  considered:
  - 체형 3종 전부 공개
  - gender 만 비공개
  - 체형 전부 비공개
  decision: grade / height_cm / weight_kg 공개, gender 비공개
  rationale: 피그마 `상대방 프로필 볼 때 화면`(3910:44008) 과 `마이페이지`(2825:42638) 의 헤더 2행이 동일하게 `레코드 사용자 | 168cm · 58kg` 이다. 등급명과 키·몸무게가 구분선과 가운뎃점으로 이어진 한 줄이며 성별은 그 줄에 없다. gender 는 프로필 작성·수정 폼과 검색 필터(게시자 성별)에서만 쓰는 비공개 입력값이므로 API-017 응답에 싣지 않는다. 카운터는 타인 프로필이 3종(피드·아이템·팔로워), 본인 마이페이지가 4종(+위시)이다 — 남의 위시리스트는 공개하지 않는다. OOTD 상세(2791:27177)의 작성자 줄은 `팔로우 101명 · 피드 60개` 뿐이라 체형을 싣지 않는다
  revisit_when: OOTD 상세에도 체형을 노출하기로 하면 API-071 의 author 블록에 height_cm·weight_kg 를 추가한다. 스키마 변경은 없다
- id: DEC-102
  topic: OOTD 태그 말풍선의 판매 상태 표시
  considered:
  - 태그 응답에 saleStatus 포함
  - 태그에 상태를 싣지 않음
  - 별도 API 로 조회
  decision: 태그 응답에 sale_status 를 함께 내려준다
  rationale: 피그마 OOTD 상세(2791:27177)의 말풍선(2791:27203)이 `Levis LVC 1955` 아래에 `#판매중` 해시태그를 2행으로 붙인다. 같은 화면의 다른 말풍선에는 2행이 없으므로 ON_SALE 일 때만 그린다. API-071 의 images[].tags[] 에 saleStatus 를 실어 클라이언트가 말풍선 높이를 결정하게 한다
  amended: 'DEC-026 으로 sale_status 가 item 컬럼이 되면서 값이 항상 있다. 이전에는 판매 등록이 없는 아이템을 null 로 내려보냈는데, 이제 NOT_FOR_SALE 로 내려간다 — 클라이언트 판정은 그대로 ''ON_SALE 일 때만 2행''이다'
- id: DEC-103
  topic: 판매·구매 내역 목록의 구성
  considered:
  - 제안 목록과 거래 목록을 별도 엔드포인트로
  - rowType 유니온으로 한 엔드포인트
  decision: rowType 유니온. API-161·API-162 가 4개 탭을 전부 담는다
  rationale: 화면의 전체 탭은 아직 거래가 아닌 제안받음과 이미 거래가 된 거래중·거래완료를 시간순으로 함께 보여준다. 엔드포인트를 둘로 쪼개면 전체 탭에서 두 응답을 클라이언트가 합쳐야 하고 그 순간 페이징이 깨진다. rowType 으로 행을 구분하고 반대쪽 필드는 null 로 둔다
  supersedes: 초기 명세는 API-146(받은 제안)·API-147(보낸 제안)을 따로 뒀고 API-161·162 의 tab 에도 OFFERED 가 있어 정본이 둘이었다
  revisit_when: 화면을 다시 보고 두 가지를 바로잡았다(v5). (1) 탭 라벨이 '제안받음'·'제안중'이 아니라 양쪽 다 '대기중'이다. (2) 판매 내역의 대기중 카드는 제안 1건이 아니라 아이템 1개이고, '확인하기'를 누르면 그 아이템의 받은 제안 목록이 따로 열린다 — 그 화면을 API-146(GET /items/{itemId}/offers)으로 되살렸다. 유니온 자체는 유지한다
- id: DEC-104
  topic: 태그된 아이템 목록의 조회 단위
  considered:
  - 게시물 단위(postId)
  - 사진 단위(post_image_id)
  decision: 사진 단위. GET /post-images/{imageId}/tagged-items
  rationale: post_item_tag 가 post_image_id 에 매달리고 화면 문구도 사진 속에서 태그된 것만 모아봅니다 이다. 게시물 단위로 조회하면 여러 사진의 태그가 섞여 화면과 단위가 어긋난다
  supersedes: 초기 명세는 GET /posts/{postId}/tagged-items 였다
- id: DEC-105
  topic: ErrorCode enum 이름과 코드 접두사의 관계
  considered:
  - enum 이름을 코드 접두사에 맞춘다
  - 코드 접두사를 enum 이름에 맞춘다
  - 불일치를 허용한다
  decision: enum 이름을 코드 접두사에 맞춘다. 예외 없음
  rationale: 코드 접두사는 클라이언트가 보는 값이라 바꾸면 계약이 깨지고, enum 이름은 서버 내부 식별자라 바꿔도 영향이 없다. 싼 쪽을 움직인다. PayoutAccountErrorCode→PayoutErrorCode(PAYOUT_*), TradeErrorCode→OrderErrorCode(ORDER_*). 한 enum 에 여러 접두사가 섞여 있던 셋은 도메인 분할과 함께 갈랐다 — Social→Follow/Block/Report, Item 에서 Category, Listing 에서 Wishlist
  revisit_when: 새 ErrorCode 를 만들 때 enum 이름과 접두사가 어긋나면 enum 이름 쪽을 고친다
- id: IDX-001
  topic: notification 의 (target_type, target_id) 복합 인덱스를 두지 않는다
  considered:
  - (target_type, target_id) 복합 인덱스 추가
  - 추가하지 않음
  decision: 추가하지 않음
  rationale: 다형 참조에 복합 인덱스를 거는 것은 '대상으로 역방향 조회'가 있을 때의 이야기다. notification 은 항상 user_id 기준으로만 조회되고(알림 목록·안읽음 배지) 특정 게시물·거래로 알림을 역추적하는 화면이 없다. 반면 알림은 쓰기가 매우 잦은 테이블이라 인덱스 하나가 곧 쓰기 비용이다. 스킬 5-2 ⑥(과도한 인덱스 경계)을 따라 추가하지 않는다. report·recent_view 는 각각 신고 검토와 중복 열람 판정에서 대상 기준 조회가 실제로 있어 인덱스를 둔다
  revisit_when: '특정 대상에 연결된 알림을 역추적하는 화면(예: 운영자의 신고 처리 화면에서 관련 알림 조회)이 생기면 재검토한다'
- id: IDX-002
  topic: chat_message.sender_id 인덱스
  considered:
  - sender_id 인덱스 추가
  - 추가하지 않음
  decision: 추가함 (경계 대상으로 표시)
  rationale: 스킬 5-2 ①(모든 FK에 인덱스 — 예외 없음)을 따라 추가했다. 다만 chat_message 는 쓰기가 잦아 ⑥ 의 경계 대상이기도 하다. 발신자별 메시지 조회 화면이 끝까지 나오지 않으면 제거를 검토한다
- id: IDX-003
  topic: ix_item_search(deleted_at, brand_name, name) 와 ix_item_listing_browse(sale_status, listed_at) 를 제거한다
  considered:
  - 현행 유지
  - 제거
  - 인덱스를 쓰는 검색 API 신설
  decision: 제거함
  rationale: 두 인덱스는 아이템 키워드 검색과 판매 중 상품 둘러보기를 전제로 만들었는데, 확정된 화면 인벤토리에 그런 화면이 없다. 검색 결과(SCR-046)의 탭은 게시물과 계정 2종뿐이고 아이템은 게시물의 태그를 통해서만 도달한다. API 명세 전체에서 두 인덱스를 쓰는 엔드포인트가 하나도 없다. 쓰지 않는 인덱스는 쓰기 비용만 남기므로 스킬 5-2 ⑥(과도한 인덱스 경계)을 따라 제거한다. 아이템 키워드 조회는 API-098(태그 가능한 내 아이템)과 내 옷장(API-091)이고 둘 다 소유자 기준이라 ix_item_registrant 가 받는다
  amended: DEC-026 으로 sale_status 가 item 컬럼이 되면서 판매 상태 필터(API-200)는 item_listing 을 거치지 않는다. ix_item_sale_status(sale_status, deleted_at) 를 item 에 뒀다 — 제거한 ix_item_listing_browse 를 되살린 것이 아니라 조인이 사라진 자리에 새로 둔 것이다
  revisit_when: 아이템/상품 검색 탭이나 판매 중 상품 둘러보기 화면이 디자인되면 그때 다시 추가한다. 컬럼 구성은 위 정의를 그대로 쓰면 된다
open_questions:
- id: Q8
  topic: 판매를 내릴 때 남아 있는 PENDING 제안의 처리
  detail: |
    판매 상태 변경은 '진행 중인 거래' 만 막는다(trade_order 가 종료 상태가 아닌 경우).
    제안은 수락돼야 trade_order 가 생기므로, 아직 수락 전인 PENDING 제안은 아무것도 막지 않는다.
    그런데 제안 시점에 결제가 이미 승인(authorized_at)돼 있다 — 판매자가 미판매로 내리면
    그 승인이 해제되지 않은 채 남아 구매자 카드에 한도가 잡힌 상태로 24시간 뒤 EXPIRED 를 기다린다.
    수락 경로에는 같은 규칙이 이미 있다 — '같은 아이템의 요청 하나를 수락하면 나머지 PENDING 을
    전부 CANCELED + OTHER_OFFER_ACCEPTED 로 전이하고 각 결제 승인을 해제한 뒤 알림을 보낸다'.
    판매를 내리는 경로에만 그 대칭이 빠져 있다.
  direction: |
    막는 것이 아니라 함께 정리하는 쪽으로 간다 — 미판매·판매 완료로 내릴 때 그 아이템의 PENDING
    제안을 CANCELED 로 전이하고 결제 승인을 해제한 뒤 알림을 보낸다. 수락 경로와 같은 모양이다.
    판매자에게 '제안을 먼저 거절하라' 고 요구하면 내리는 동작이 두 단계가 되어 화면과 어긋난다.
  deferred_to: |
    결제 승인 해제가 payment 도메인이라 listing 혼자 끝낼 수 없다. offer·payment 를 구현할 때
    수락 경로와 함께 설계한다. 그때 cancel_reason 에 LISTING_CLOSED 같은 값이 필요한지도 함께 본다.
- id: Q7
  topic: 인증번호 재전송 정책
  detail: 회원가입과 비밀번호 찾기 모두 인증번호 입력 옆에 '재전송' 버튼이 있다(2791:17054·2791:21343). 쿨다운(몇 초 후 다시 누를 수 있는지)과 1일 발송 한도가 정해지지 않았다. DEC-009 는 Redis 키를 SET 으로 덮어쓰므로 재전송 자체는 동작하지만, 제한이 없으면 메일 발송이 그대로 어뷰징 통로가 된다
- id: Q6
  topic: 카테고리별 사이즈 체계의 매핑
  detail: '사이즈 선택지가 펼쳐진 화면을 아이템 등록(2825:47795)과 판매 전환(3342:32943)에서 찾았다. 체계는 4종이다 — ALPHA(XS·S·M·L·XL·2XL·3XL) / KR_NUMERIC(85·90·95·100·105·110·115) / EU_NUMERIC(36·38·40·42·44·46·48·50) / FREE_NUMBER(0~6). 남은 것은 대분류 10종이 각각 어느 체계를 쓰는지다 — 화면이 카테고리와 무관하게 네 체계를 한 번에 펼쳐 놓아 매핑을 읽을 수 없었다. 그때까지 size_scheme 은 NULL 로 둔다'
design_exclusions:
- topic: email_verification 테이블
  detail: ERD 에 테이블을 두지 않는다. 인증번호와 토큰은 Redis 로 관리하며 근거는 DEC-009 에 있다
- topic: AI 아이템 인식
  detail: 감지 영역·후보 목록·신뢰도를 저장하지 않는다. '원하는 아이템을 클릭하면 AI가 해당 아이템을 포착하고 분석하면서 유사한 아이템을 찾습니다' — 사용자가 확정한 post_item_tag 만 영속화하고 후보는 휘발시킨다. AI 는 외부 서비스로 본다
- topic: 태그 수정 이력
  detail: post_tag_edit_log 는 정의만 하고 MVP 외로 표시했다. '태그 수정 - 핵심 MVP X', '핵심 MVP 구현 이후 구현 확정 시 자세히 작성될 예정입니다'
- topic: 로그아웃·공유하기
  detail: 저장 대상이 없다. 로그아웃은 세션, 공유하기는 읽기 전용 모달
- topic: 공지사항·문의하기
  detail: 설정 > 서비스 메뉴에 '공지사항'·'문의하기'가 있으나 테이블을 두지 않는다. 관리자 기능을 이미 범위 밖으로 뒀기 때문에 공지를 쓸 주체도, 문의에 답할 주체도 없다. 약관·개인정보 처리방침·버전 정보와 함께 정적 페이지나 외부 링크로 처리한다
- topic: 관리자 기능
  detail: 신고 접수 후 운영자가 게시물·아이템을 내리는 흐름을 이번 범위에서 제외한다. report 는 접수까지만 담고 처리 상태·운영자 계정은 두지 않는다. 관리자 화면이 디자인되면 그때 설계한다
- topic: 탈퇴 후 재가입으로 인한 제안 기회 초기화
  detail: 탈퇴 즉시 재가입이 가능하므로 새 user_id 를 받으면 purchase_offer 의 아이템당 1회 제한을 비켜간다. **알고 넘어가는 것**이다 — 등급도 BASIC 으로 초기화돼 실질 이득이 크지 않고, 막으려면 탈퇴자 식별 정보를 보관해야 해서 즉시 익명화 원칙과 충돌한다. 어뷰징이 실제로 관측되면 재검토한다
- topic: refresh token 테이블
  detail: ERD 에 refresh_token 테이블을 두지 않는다. Redis 로 관리하며 근거는 DEC-010 에 있다. spring-boot-starter-data-redis 의존성이 추가로 필요하다
