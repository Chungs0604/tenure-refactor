    evidence: '''구매자 정보'' 섹션'
  - name: sellerId
    column: seller_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: '''판매자 정보'' 섹션. ''YuJin님에게'''
  - name: offerType
    column: offer_type
