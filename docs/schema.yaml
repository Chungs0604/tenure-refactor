    evidence: 밑단(cm). 카테고리별로 필수·금지가 갈린다 (사용자 지정 사양)
  - name: hipWidth
    column: hip_width
    db_type: DECIMAL(5,1)
    java_type: BigDecimal
    nullable: true
    source: design
    evidence: 엉덩이 단면(cm). 카테고리별로 필수·금지가 갈린다 (사용자 지정 사양)
  indexes:
  - name: uk_item_measurement_item
    columns:
    - item_id
    unique: true
  pattern: 값 객체 (embeddable)
  pattern_note: EAV 가 아니다. 필드가 10개로 고정돼 있고 카테고리가 늘어도 항목이 늘지 않는다. 5개 대분류(신발·가방·모자·액세서리·주얼리)는 행 자체가 생기지 않으므로 item 에 인라인하지 않고 1:1 테이블로 분리한다
  constraints:
  - rule: 상의·아우터·원피스 — 어깨 너비·가슴 단면·소매길이·총 기장 4개 필수, 나머지 6개는 NULL 이어야 한다
    enforced_by: application
    source: design
    evidence: 사용자 지정 사양 — 상의·아우터·원피스 규칙
  - rule: 하의 — 허리 단면·허벅지 단면·총 기장·밑위·인심·밑단 6개 필수, 어깨·가슴·소매·엉덩이 4개는 NULL 이어야 한다
    enforced_by: application
    source: design
    evidence: 사용자 지정 사양 — 하의 규칙
  - rule: 치마 — 허리 단면·엉덩이 단면·밑단·총 기장 4개 필수, 어깨·가슴·소매·허벅지·밑위·인심 6개는 NULL 이어야 한다
    enforced_by: application
    source: design
    evidence: 사용자 지정 사양 — 치마 규칙
  - rule: 신발·가방·모자·액세서리·주얼리 — 실측 입력 자체가 금지. item_measurement 행을 만들지 않는다
    enforced_by: application
    source: design
    evidence: 사용자 지정 사양 — 실측 미적용 카테고리
  - rule: 판정 기준은 대분류(category.depth=1) 이름이다. 세부 카테고리는 보지 않는다 — 데님 팬츠·슬랙스·레깅스 모두 하의 6종
    enforced_by: application
    source: design
    evidence: 사용자 지정 사양 — 판정은 대분류 이름으로만
