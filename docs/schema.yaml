  source: design
  evidence: 거래 상세 '거래 진행 단계' 설명 문구에서 순서 확정 + 타임라인 체크 5단계(25.05.26 결제완료 → 25.05.28 상품발송 → 25.06.01 배송완료 → 25.06.02 구매확정 → 25.06.04 정산완료). '정산이 완료되면 거래 상태는 정산 완료로 변경되며, 거래가 마무리됩니다' — SETTLED가 최종 상태이고 별도의 COMPLETED 상태는 없다
  display_label_override: SETTLED는 viewerRole에 따라 표시 문구가 갈린다 — 판매자(SELLER)에게는 '정산 완료', 구매자(BUYER)에게는 '거래 완료'. 둘 다 같은 OrderStatus.SETTLED 값이며 enum을 분리하지 않는다
