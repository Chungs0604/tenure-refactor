    evidence: 제안서 상세의 수령인. API-141 요청의 shippingAddressId 가 가리키는 shipping_address 를
      생성 시점에 스냅샷한다 — FK 로 걸면 응답 대기 중 주소록 수정·삭제가 이미 보낸 제안의 배송지를 바꾼다
  - name: shippingPhone
