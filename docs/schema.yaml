    내릴 때 남은 PENDING 제안은 수락 경로의 자동 취소 규칙과 대칭으로 정리하기로 했다(결제 승인
    해제 + 알림). OTHER_OFFER_ACCEPTED 와 마찬가지로 제안자 잘못이 아니므로 1회 제한에서 제외한다
