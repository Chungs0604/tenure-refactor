- name: ItemOwnership
  table: item_ownership
  domain: item
  description: 아이템의 소유 구간. 상품 상세 'Tenure 기록 기준' 섹션이 이 테이블 그대로다. 거래 완료 시 이전 행의 end_date 를 닫고 구매자 행을 새로 연다.
  soft_delete: false
  delete_policy: D
  delete_rationale: 0순위 — 이 테이블이 비워지면 '기록 승계'라는 서비스의 핵심 가치가 즉시 깨진다. 소유·승계 이력이므로 append-only 로 고정한다.
  source: design
  evidence:
  - '상품 상세 ''Tenure 기록 기준'': 유진나라 26.07.10~현재 OOTD 인증 12회 / 소소한 행복 25.02.8~26.07.10 OOTD 인증 8회 [최초 등록]'
  - '''구매자는 아이템의 기록을 이어서 받게됩니다.'''
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: itemId
    column: item_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 대상 아이템
  - name: ownerId
    column: owner_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 구간 소유자. 화면에 닉네임 표시
  - name: startDate
    column: start_date
    db_type: DATE
    java_type: LocalDate
    nullable: false
    source: design
    evidence: '''25.02.8 ~'' 구간 시작. **최초 구간은 item.first_owned_date 를 그대로 쓴다.** 거래로 승계된 구간은 구매 확정일'
  - name: endDate
    column: end_date
    db_type: DATE
    java_type: LocalDate
    nullable: true
    source: design
    evidence: '''~ 26.07.10'' 구간 종료. NULL 이면 ''~ 현재'''
  - name: acquiredBy
    column: acquired_by
    db_type: VARCHAR(30)
    java_type: AcquiredBy
    nullable: false
    enum: AcquiredBy
    source: design
    evidence: '''최초 등록'' 뱃지 유무'
  - name: orderId
    column: order_id
    db_type: BIGINT
    java_type: Long
    nullable: true
    source: inferred
    evidence: acquired_by=TRADE 일 때 근거 거래. AcquiredBy.TRADE 의 발생 근거 자리
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  indexes:
  - name: ix_item_ownership_item
    columns:
    - item_id
    - start_date
    unique: false
  - name: ix_item_ownership_owner
    columns:
    - owner_id
    unique: false
  - name: ix_item_ownership_order
    columns:
    - order_id
    unique: false
    note: FK 인덱스 — 거래로 승계된 구간 역추적
  constraints:
  - rule: item_id 당 end_date IS NULL 인 행은 최대 1개
    enforced_by: application
    source: design
    evidence: '''~ 현재'' 구간은 하나뿐'
  - rule: append-only. DELETE 금지. UPDATE 는 두 경우만 허용한다 — (1) 거래 완료 시 end_date 를 닫을 때, (2) 최초 구간의 start_date 를 item.first_owned_date 수정에 맞춰 갱신할 때
    enforced_by: application
    source: design
    evidence: 확정 사양
  - rule: item.first_owned_date 수정은 소유 구간이 1개이고 본인이 현재 소유자일 때만 허용한다. 거래 이력이 생기는 순간(구간이 2개 이상) 잠긴다
    enforced_by: application
    source: design
    evidence: 이전 소유자가 자기 구간의 시작일을 고치면 구매자가 보고 산 "Tenure 기록 기준"이 사후에 달라진다. item_wear_record 의 "종료된 구간은 손대지 못한다" 규칙과 같은 원리다
  pattern: 유효 구간 (temporal validity)
  pattern_note: 소유 구간이 행으로 쌓이고 end_date IS NULL 이 현재 구간이다. 같은 아이템에 구간이 겹치지 않아야 하며, 0순위 테이블이라 append-only 다
  correction_path: 최초 구간의 start_date 만 item.first_owned_date 수정에 따라 갱신된다. 소유 구간이 1개이고 본인이 현재 소유자일 때만 허용하며, 거래 이력이 생기면 잠긴다
- name: ItemWearRecord
  table: item_wear_record
  domain: item
  description: 착용 기록('OOTD 인증'). PostItemTag 에서 파생 가능하지만 별도 테이블로 둔다 — 인증 횟수가 소유 구간별로 집계되므로 ownership_id 가 필요하고, 아이템이 승계된 뒤에도 이전 소유자의 인증 이력이 그대로 남아야 한다.
  soft_delete: false
  delete_policy: D
  delete_rationale: 0순위 — 'OOTD 인증 N회'는 이 서비스가 옷의 가치를 증명하는 유일한 수단이다. 활동·인증 기록이므로 append-only 로 고정한다.
  source: design
  evidence:
  - 상품 상세 'OOTD 인증 12회' / 'OOTD 인증 8회'
  - '''최근 착용'''
  - 채팅방 헤더 '판매 중 · 최근 착용 1일 전'
  - '''아이템 히스토리'' 사진 그리드'
  fields:
  - name: id
    column: id
    db_type: BIGINT
    java_type: Long
    pk: true
    auto_increment: true
    nullable: false
    source: inferred
    evidence: PK 관례
  - name: itemId
    column: item_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 대상 아이템
  - name: ownershipId
    column: ownership_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 소유 구간별 'OOTD 인증 N회' 집계 단위
  - name: postId
    column: post_id
    db_type: BIGINT
    java_type: Long
    nullable: false
    source: design
    evidence: 인증 근거 게시물. '아이템 히스토리'가 이 링크로 사진을 모은다
  - name: wornDate
    column: worn_date
    db_type: DATE
    java_type: LocalDate
    nullable: false
    source: design
    evidence: '''최근 착용'' 계산 기준. post.worn_date 를 복사'
  - name: createdAt
    column: created_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: false
    source: inferred
    evidence: 감사 컬럼 관례
  - name: voidedAt
    column: voided_at
    db_type: DATETIME(6)
    java_type: LocalDateTime
    nullable: true
    source: inferred
    evidence: 태그가 다른 아이템으로 바뀌거나 삭제되면 이 인증을 무효화한다. 행은 지우지 않는다(append-only). 인증 횟수 집계는 WHERE voided_at IS NULL
  - name: voidedReason
    column: voided_reason
    db_type: VARCHAR(30)
    java_type: WearRecordVoidReason
    nullable: true
    enum: WearRecordVoidReason
    source: inferred
    evidence: 무효화 사유. voided_at 이 NULL 이 아닐 때만 채워진다
  indexes:
  - name: ix_item_wear_record_item
    columns:
    - item_id
    - voided_at
    - worn_date
    unique: false
    note: '''최근 착용'' 조회. item_id·voided_at 등치 → worn_date 정렬'
  - name: ix_item_wear_record_ownership
    columns:
    - ownership_id
    - voided_at
    unique: false
    note: 소유 구간별 'OOTD 인증 N회' 집계. 둘 다 등치 조건
  - name: uk_item_wear_record
    columns:
    - item_id
    - post_id
    unique: true
    note: 같은 게시물이 같은 아이템을 두 번 인증하지 않는다
  - name: ix_item_wear_record_post
    columns:
    - post_id
    unique: false
    note: FK 인덱스 — uk(item_id, post_id) 의 선두가 아니라 별도 필요
  constraints:
  - rule: append-only. DELETE 금지. 무효화는 voided_at 으로 표시한다
    enforced_by: application
    source: inferred
    evidence: 0순위 테이블
  - rule: ownership_id 가 종료된 구간(end_date IS NOT NULL)을 가리키면 해당 태그의 수정·삭제를 차단한다. 무효화는 현재 구간(end_date IS NULL)에 대해서만 허용된다
    enforced_by: application
    source: inferred
    evidence: 판매 후 이전 소유자가 과거 태그를 지우면 구매자가 보고 산 "OOTD 인증 N회"가 사후에 줄어든다. 기록 승계 약속이 깨지므로 원천 차단한다
  - rule: 태그 생성 시 (item_id, post_id) 로 void 된 행이 이미 있으면 INSERT 하지 말고 voided_at·voided_reason 을 NULL 로 되돌린다
    enforced_by: application
    source: inferred
    evidence: uk_item_wear_record(item_id, post_id) 때문에 void 후 같은 조합을 다시 태그하면 중복 키로 실패한다
  correction_path: voided_at + voided_reason(TAG_CHANGED|TAG_DELETED). 현재 소유 구간에 대해서만 허용하고, 종료된 구간의 태그는 수정·삭제 자체를 차단한다
