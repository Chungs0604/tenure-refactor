design_decisions:
- id: DEC-001
  topic: 아이템 마스터(product) 테이블을 두지 않는다
  considered:
  - product 마스터 테이블 도입
  - 아이템만 두고 마스터 없이 간다
  decision: 현행 유지
  rationale: 태그는 본인이 보유한 아이템에만 달 수 있으므로 AI 유사도 탐색 범위가 본인 옷장으로 한정된다. 동일 모델 식별이 태그 목적에는 불필요해져 마스터 상품의 근거가 사라졌다
  revisit_when: '''이 모델의 모든 매물'' 같은 교차 사용자 탐색 화면이 생기면 재검토한다'
- id: DEC-002
  topic: 유효 OOTD 판정을 비정규화하지 않는다
  considered:
  - post.has_item_tag 비정규화 컬럼
  - EXISTS 서브쿼리
  decision: EXISTS 서브쿼리 유지
  rationale: 판정 범위가 한 사용자의 직전 30일로 좁고 ix_post_author_created 가 받아준다. post.has_item_tag 를 두면 태그 변경 경로마다 갱신을 빠뜨릴 위험이 생긴다
- id: DEC-003
  topic: 공휴일 판단
  considered:
  - 공공 API + Redis 캐시
  - holiday 마스터 테이블
  - 애플리케이션 메모리 캐시
  decision: 공공 API 연동 + Redis 캐시
  rationale: 대체공휴일·임시공휴일이 매년 바뀌어 holiday 마스터 테이블은 매년 운영 부담이 된다. ERD 에는 테이블을 만들지 않는다. 캐시는 Redis 에 둔다 — 키 `holiday:{yyyy}` 에 그 해의 공휴일 목록을 담고 TTL 을 건다. DEC-009·DEC-010 과 같은 기준이다(TTL 휘발 데이터는 RDB 에 두지 않는다). 애플리케이션 메모리 캐시는 인스턴스가 늘면 각자 외부 API 를 치게 되고, 스택에 이미 Redis 가 있어 캐시 방식을 둘로 둘 이유가 없다
  revisit_when: 외부 API 장애로 정산 배치가 멈추는 사고가 나면 캐시 테이블 도입을 검토한다
- id: DEC-004
  topic: 탈퇴 처리
  considered:
  - 탈퇴 즉시 익명화 + 즉시 재가입 허용
  - 유예 기간 후 파기
  - 물리 삭제
  decision: 탈퇴 즉시 익명화 + 즉시 재가입 허용
  rationale: email 은 withdrawn_{id}@deleted.local 로, phone·real_name 은 마스크로 치환하고 nickname 은 탈퇴한사용자_{id} 로 바꾼다. user 행과 FK 는 유지되어 Tenure 기록 기준의 이전 소유자 표시가 남는다. 거래 기록은 order_shipment·settlement 의 스냅샷으로 보존된다
- id: DEC-005
  topic: 설정의 기본 배송비 기능
  considered:
  - user.default_shipping_fee 컬럼 추가
  - 이번 범위에서 제외
  decision: 이번 범위에서 제외
  rationale: user.default_shipping_fee 컬럼을 만들지 않는다. 그 결과 미판매 아이템 구매 제안의 배송비는 항상 0원(판매자 부담)이 된다
  revisit_when: 설정 화면이 디자인되면 컬럼을 추가한다
- id: DEC-006
  topic: 이미지 저장소
  considered:
  - S3 전용
  - 로컬 파일시스템 전용
  - 설정값으로 전환(local | s3)
  decision: 로컬 + S3, 설정값으로 전환
  rationale: 'app.storage.type(STORAGE_TYPE 환경변수)으로 LocalFileStorage / S3FileStorage 를 고른다. 개발자는 AWS 자격증명 없이 로컬 파일시스템으로 돌리고, 배포 시 환경변수만 바꾼다. global/storage/FileStorage 인터페이스 뒤에 두 구현을 @ConditionalOnProperty 로 배치해 런타임 분기가 없다. 이미지 컬럼(*_image_key)에는 저장소와 무관한 **키**(예: post/2026/03/ab12.jpg)를 넣고, 조회 시 FileStorage.toUrl() 이 현재 설정의 base-url 을 붙인다. 전체 URL 을 저장하면 로컬에서 넣은 데이터를 운영에 올릴 때 URL 이 깨지고 도메인 변경 시 전수 마이그레이션이 필요하다'
  revisit_when: CDN 을 붙이면 app.storage.s3.base-url 만 바꾼다. 스키마 변경은 필요 없다
- id: DEC-007
  topic: 최초 소유 구간의 start_date
  considered:
  - 수정 불가로 고정
  - item.first_owned_date 로 채우고 거래 전까지만 수정 허용
  - ownership 과 완전 분리
  decision: item.first_owned_date 로 채우고, 거래 전까지만 수정 허용
  rationale: 화면의 'Tenure 기록 기준' 첫 구간과 '최초 보유 날짜'가 같은 값으로 보이므로 둘을 일치시킨다. 대신 append-only 제약에 예외를 하나 연다 — 소유 구간이 1개이고 본인이 현재 소유자일 때만 최초 구간의 start_date 를 갱신할 수 있다. 거래 이력이 생기면 잠긴다. 이전 소유자가 시작일을 고치면 구매자가 보고 산 기록이 사후에 달라지기 때문이다
- id: DEC-008
  topic: 운송장 번호 정정
  considered:
  - order_shipment_history 이력 테이블 도입
  - 재입력 허용·이력 미보관
  - 정정 불가
  decision: 배송 완료 전까지 재입력 허용, 이력 미보관
  rationale: 형식 검증을 통과한 틀린 번호를 구제하되 DELIVERED 이후에는 잠근다. 이력 테이블을 두지 않아 이전 번호는 추적할 수 없다 — 지금 규모에서 테이블 하나를 더 두는 비용이 이득보다 크다고 봤다
  revisit_when: 배송 분쟁이 실제로 발생해 이전 운송장 추적이 필요해지면 order_shipment_history 를 추가한다
- id: DEC-009
  topic: 이메일 인증번호·토큰의 저장소
  considered:
  - Redis
  - RDB 테이블(email_verification)
  - JWT 자체 서명
  decision: Redis (RDB 테이블 없음). 1회용은 GETDEL 로 보장
  rationale: 인증번호(3분)와 인증 토큰(10분)은 TTL 이 있는 휘발 데이터다. DEC-010 이 refresh token 에 적용한 기준을 그대로 적용한다 — RDB 에 두지 않는다. 키는 `email-verify:{purpose}:{email}` 에 인증번호와 인증 여부를, `email-verify-token:{token}` 에 대상(purpose, email)을 담고 각각 TTL 을 건다. (1) 만료가 TTL 로 끝나 정리 배치가 필요 없다 (2) 재발급은 SET 덮어쓰기라 이전 것이 자동으로 무효화된다 (3) (email, purpose) 당 1행 제약을 키 구조가 강제한다 (4) 1회용은 GETDEL 이 조회와 삭제를 원자적으로 처리해 consumed_at 플래그 자체가 필요 없다. JWT 자체 서명은 재사용을 막을 수 없어 배제한다 — 비밀번호 재설정 토큰이 유출되면 수명 내내 반복 변경이 가능해진다. purpose 를 키에 넣어 SIGN_UP 토큰으로 PASSWORD_RESET 을 수행하지 못하게 막는다
  supersedes: 최초 설계는 email_verification 테이블이었다. DEC-010 과 같은 성격의 데이터인데 저장소 결정이 엇갈려 있었고, V3 에서 테이블을 제거했다
  revisit_when: 인증번호 발송 횟수 제한이나 어뷰징 추적처럼 이력을 남겨야 하는 요구가 생기면 별도 테이블을 검토한다. 인증 자체는 Redis 에 둔 채 시도 기록만 쌓는 편이 낫다
- id: DEC-010
  topic: refresh token 저장소
  considered:
  - Redis
  - RDB 테이블(refresh_token)
  - JWT 자체 서명만
  decision: Redis (RDB 테이블 없음)
  rationale: refresh token 은 TTL 이 있는 휘발 데이터이므로 RDB 에 두지 않는다. 키 `refresh:{userId}:{tokenId}` 에 토큰과 만료를 담고 로그아웃 시 삭제해 무효화한다. API-001 의 keepLoggedIn 은 Redis TTL 을 늘리는 것으로 구현한다. JWT 자체 서명만 쓰면 로그아웃 시 무효화가 불가능해 유출된 토큰이 만료까지 살아있다
  revisit_when: 기기별 세션 목록·원격 로그아웃 같은 화면이 생기면 RDB 테이블 도입을 재검토한다
- id: DEC-013
  topic: 거래 시점 값을 스냅샷하는 기준
  considered:
  - FK 로 원본을 참조
  - 값을 복사(스냅샷)
  - 복사와 FK 를 함께 둔다
  decision: 값을 복사한다. 원본을 FK 로 참조하지 않는다
  rationale: 거래는 체결 시점의 조건으로 고정되어야 한다. 원본(배송지·정산계좌·판매가·수수료 요율)은 사용자가 나중에 고치거나 지울 수 있어 FK 로 묶으면 과거 거래가 사후에 달라지거나 삭제가 막힌다. 복사 시점은 그 값이 거래 조건으로 확정되는 순간이다 — purchase_offer 는 제안 전송 시점(요율·수수료), order_shipment 는 제안 전송 시점(배송지), trade_order 는 수락 시점(금액), settlement 는 구매 확정 시점(계좌). item_wear_record.worn_date 는 태그 생성 시점의 post.worn_date 다. 복사한 컬럼에는 FK 를 걸지 않는다 — 걸면 스냅샷의 목적이 사라진다
  revisit_when: 스냅샷 컬럼을 새로 추가할 때 이 기준의 어느 시점에 해당하는지 먼저 정한다. 해당하는 시점이 없으면 스냅샷이 아니라 파생 컬럼일 수 있다
- id: DEC-014
  topic: 최근 본 게시물·사용자의 저장소
  considered: [Redis Sorted Set, RDB 테이블 + 사용자당 건수 상한, RDB 테이블 + 보관 기간 배치]
  decision: Redis Sorted Set (RDB 테이블 없음)
  rationale: 열람 이력은 다시 볼 일도 남길 이유도 없는데 RDB 에 영구 보관되고 있었다 — 보관 정책이 아예 없었다. 게다가 게시물·프로필을 조회할 때마다 쓰기가 일어나 읽기 경로에 쓰기가 붙은 구조다. Sorted Set 이 기존 동작을 그대로 한다 — 키 `recent-view:{userId}:{targetType}` 에 score 를 열람 시각으로 두면 ZADD 가 재열람 시 score 만 갱신해 uk(user_id, target_type, target_id) 와 같고, ZREVRANGE 로 최근 N건을 읽고 ZREMRANGEBYRANK 로 상한을 유지한다. 구조가 보관 정책을 대신하므로 기간을 따로 정할 필요가 없다. DEC-003·DEC-009·DEC-010 과 같은 기준이다
  supersedes: 최초 설계는 recent_view 테이블이었다. 삭제 정책을 C(하드 삭제)로 분류해놓고 지우는 경로를 정하지 않아 api-spec 의 CRUD 표에 보관 정책 없음 으로 남아 있었다. V4 에서 테이블을 제거했다
  revisit_when: 열람 이력으로 추천 모델을 학습시키는 등 장기 보관이 필요해지면 별도 저장소를 검토한다. 화면에 쓰는 최근 목록은 그때도 Redis 에 둔다
- id: DEC-015
  topic: 알림의 보관 기간
  considered: [90일 경과 삭제, 사용자당 최근 200건 유지, 보관 정책을 두지 않음]
  decision: 90일 경과 삭제 (배치)
  rationale: 알림은 읽음 상태와 탭별 페이징이 있어 RDB 가 맞다 — 여기까지는 recent_view 와 다르다. 다만 UNIQUE 제약이 없어 거래·제안·팔로우·위시 이벤트마다 행이 쌓이고 지우는 경로가 없어 무한히 증가했다. 화면이 어제 · 10월 24일 수준의 최근성을 보여주므로 90일이면 체감 손실이 없다. 건수 상한은 거래가 몰린 날 오래된 알림이 기간과 무관하게 밀려나서 택하지 않았다
  revisit_when: 운영 데이터를 확보한 뒤 실제 조회 분포를 보고 기간을 조정한다. 알림량이 예상보다 많으면 읽은 것과 안 읽은 것의 기간을 나누는 안을 검토한다
- id: DEC-101
  topic: 타인에게 보이는 프로필 필드 — 등급·키·몸무게는 공개, 성별은 비공개
  considered:
  - 체형 3종 전부 공개
  - gender 만 비공개
  - 체형 전부 비공개
  decision: grade / height_cm / weight_kg 공개, gender 비공개
  rationale: 피그마 `상대방 프로필 볼 때 화면`(3910:44008) 과 `마이페이지`(2825:42638) 의 헤더 2행이 동일하게 `레코드 사용자 | 168cm · 58kg` 이다. 등급명과 키·몸무게가 구분선과 가운뎃점으로 이어진 한 줄이며 성별은 그 줄에 없다. gender 는 프로필 작성·수정 폼과 검색 필터(게시자 성별)에서만 쓰는 비공개 입력값이므로 API-017 응답에 싣지 않는다. 카운터는 타인 프로필이 3종(피드·아이템·팔로워), 본인 마이페이지가 4종(+위시)이다 — 남의 위시리스트는 공개하지 않는다. OOTD 상세(2791:27177)의 작성자 줄은 `팔로우 101명 · 피드 60개` 뿐이라 체형을 싣지 않는다
  revisit_when: OOTD 상세에도 체형을 노출하기로 하면 API-071 의 author 블록에 height_cm·weight_kg 를 추가한다. 스키마 변경은 없다
- id: DEC-102
  topic: OOTD 태그 말풍선의 판매 상태 표시
  considered:
  - 태그 응답에 saleStatus 포함
  - 태그에 상태를 싣지 않음
  - 별도 API 로 조회
  decision: 태그 응답에 sale_status 를 함께 내려준다
  rationale: 피그마 OOTD 상세(2791:27177)의 말풍선(2791:27203)이 `Levis LVC 1955` 아래에 `#판매중` 해시태그를 2행으로 붙인다. 같은 화면의 다른 말풍선에는 2행이 없으므로 ON_SALE 일 때만 그린다. API-071 의 images[].tags[] 에 saleStatus 를 실어 클라이언트가 말풍선 높이를 결정하게 한다. 판매 등록이 없는 아이템은 null 이다
- id: DEC-103
  topic: 판매·구매 내역 목록의 구성
  considered:
  - 제안 목록과 거래 목록을 별도 엔드포인트로
  - rowType 유니온으로 한 엔드포인트
  decision: rowType 유니온. API-161·API-162 가 4개 탭을 전부 담는다
  rationale: 화면의 전체 탭은 아직 거래가 아닌 제안받음과 이미 거래가 된 거래중·거래완료를 시간순으로 함께 보여준다. 엔드포인트를 둘로 쪼개면 전체 탭에서 두 응답을 클라이언트가 합쳐야 하고 그 순간 페이징이 깨진다. rowType 으로 행을 구분하고 반대쪽 필드는 null 로 둔다
  supersedes: 초기 명세는 API-146(받은 제안)·API-147(보낸 제안)을 따로 뒀고 API-161·162 의 tab 에도 OFFERED 가 있어 정본이 둘이었다
- id: DEC-104
  topic: 태그된 아이템 목록의 조회 단위
  considered:
  - 게시물 단위(postId)
  - 사진 단위(post_image_id)
  decision: 사진 단위. GET /post-images/{imageId}/tagged-items
  rationale: post_item_tag 가 post_image_id 에 매달리고 화면 문구도 사진 속에서 태그된 것만 모아봅니다 이다. 게시물 단위로 조회하면 여러 사진의 태그가 섞여 화면과 단위가 어긋난다
  supersedes: 초기 명세는 GET /posts/{postId}/tagged-items 였다
- id: DEC-105
  topic: ErrorCode enum 이름과 코드 접두사의 관계
  considered:
  - enum 이름을 코드 접두사에 맞춘다
  - 코드 접두사를 enum 이름에 맞춘다
  - 불일치를 허용한다
  decision: enum 이름을 코드 접두사에 맞춘다. 예외 없음
  rationale: 코드 접두사는 클라이언트가 보는 값이라 바꾸면 계약이 깨지고, enum 이름은 서버 내부 식별자라 바꿔도 영향이 없다. 싼 쪽을 움직인다. PayoutAccountErrorCode→PayoutErrorCode(PAYOUT_*), TradeErrorCode→OrderErrorCode(ORDER_*). 한 enum 에 여러 접두사가 섞여 있던 셋은 도메인 분할과 함께 갈랐다 — Social→Follow/Block/Report, Item 에서 Category, Listing 에서 Wishlist
  revisit_when: 새 ErrorCode 를 만들 때 enum 이름과 접두사가 어긋나면 enum 이름 쪽을 고친다
- id: IDX-001
  topic: notification 의 (target_type, target_id) 복합 인덱스를 두지 않는다
  considered:
  - (target_type, target_id) 복합 인덱스 추가
  - 추가하지 않음
  decision: 추가하지 않음
  rationale: 다형 참조에 복합 인덱스를 거는 것은 '대상으로 역방향 조회'가 있을 때의 이야기다. notification 은 항상 user_id 기준으로만 조회되고(알림 목록·안읽음 배지) 특정 게시물·거래로 알림을 역추적하는 화면이 없다. 반면 알림은 쓰기가 매우 잦은 테이블이라 인덱스 하나가 곧 쓰기 비용이다. 스킬 5-2 ⑥(과도한 인덱스 경계)을 따라 추가하지 않는다. report·recent_view 는 각각 신고 검토와 중복 열람 판정에서 대상 기준 조회가 실제로 있어 인덱스를 둔다
  revisit_when: '특정 대상에 연결된 알림을 역추적하는 화면(예: 운영자의 신고 처리 화면에서 관련 알림 조회)이 생기면 재검토한다'
- id: IDX-002
  topic: chat_message.sender_id 인덱스
  considered:
  - sender_id 인덱스 추가
  - 추가하지 않음
  decision: 추가함 (경계 대상으로 표시)
  rationale: 스킬 5-2 ①(모든 FK에 인덱스 — 예외 없음)을 따라 추가했다. 다만 chat_message 는 쓰기가 잦아 ⑥ 의 경계 대상이기도 하다. 발신자별 메시지 조회 화면이 끝까지 나오지 않으면 제거를 검토한다
- id: IDX-003
  topic: ix_item_search(deleted_at, brand_name, name) 와 ix_item_listing_browse(sale_status, listed_at) 를 제거한다
  considered:
  - 현행 유지
  - 제거
  - 인덱스를 쓰는 검색 API 신설
  decision: 제거함
  rationale: 두 인덱스는 아이템 키워드 검색과 판매 중 상품 둘러보기를 전제로 만들었는데, 확정된 화면 인벤토리에 그런 화면이 없다. 검색 결과(SCR-046)의 탭은 게시물과 계정 2종뿐이고 아이템은 게시물의 태그를 통해서만 도달한다. API 명세 97개 중 두 인덱스를 쓰는 엔드포인트가 하나도 없다. 쓰지 않는 인덱스는 쓰기 비용만 남기므로 스킬 5-2 ⑥(과도한 인덱스 경계)을 따라 제거한다. 아이템 키워드 조회는 API-098(태그 가능한 내 아이템)뿐이고 이것은 소유자 기준이라 ix_item_registrant 가 받는다. 판매 상태 필터(API-200)는 게시물에서 아이템으로 내려가는 방향이라 ix_item_listing_item 이 받는다
  revisit_when: 아이템/상품 검색 탭이나 판매 중 상품 둘러보기 화면이 디자인되면 그때 다시 추가한다. 컬럼 구성은 위 정의를 그대로 쓰면 된다
open_questions:
- id: Q6
  topic: 카테고리별 사이즈 체계
  detail: 대분류 10종과 세부 카테고리 102종을 검색 필터 화면(2825:38923)에서 전량 확보해 V2__seed_category.sql 로 넣었다 — 아우터 14 / 상의 12 / 하의 11 / 신발 8 / 가방 10 / 모자 9 / 치마 11 / 원피스 9 / 액세서리 9 / 주얼리 9. 남은 것은 category.size_scheme 값 목록뿐이다 — '아이템 상세 정보 수정 (카테고리마다 세부 카테고리, 사이즈 다름)' 문구는 있으나 사이즈 선택지가 펼쳐진 화면을 찾지 못했다
design_exclusions:
- topic: email_verification 테이블
  detail: ERD 에 테이블을 두지 않는다. 인증번호와 토큰은 Redis 로 관리하며 근거는 DEC-009 에 있다
- topic: AI 아이템 인식
  detail: 감지 영역·후보 목록·신뢰도를 저장하지 않는다. '원하는 아이템을 클릭하면 AI가 해당 아이템을 포착하고 분석하면서 유사한 아이템을 찾습니다' — 사용자가 확정한 post_item_tag 만 영속화하고 후보는 휘발시킨다. AI 는 외부 서비스로 본다
- topic: 태그 수정 이력
  detail: post_tag_edit_log 는 정의만 하고 MVP 외로 표시했다. '태그 수정 - 핵심 MVP X', '핵심 MVP 구현 이후 구현 확정 시 자세히 작성될 예정입니다'
- topic: 로그아웃·공유하기
  detail: 저장 대상이 없다. 로그아웃은 세션, 공유하기는 읽기 전용 모달
- topic: 관리자 기능
  detail: 신고 접수 후 운영자가 게시물·아이템을 내리는 흐름을 이번 범위에서 제외한다. report 는 접수까지만 담고 처리 상태·운영자 계정은 두지 않는다. 관리자 화면이 디자인되면 그때 설계한다
- topic: 탈퇴 후 재가입으로 인한 제안 기회 초기화
  detail: 탈퇴 즉시 재가입이 가능하므로 새 user_id 를 받으면 purchase_offer 의 아이템당 1회 제한을 비켜간다. **알고 넘어가는 것**이다 — 등급도 BASIC 으로 초기화돼 실질 이득이 크지 않고, 막으려면 탈퇴자 식별 정보를 보관해야 해서 즉시 익명화 원칙과 충돌한다. 어뷰징이 실제로 관측되면 재검토한다
- topic: refresh token 테이블
  detail: ERD 에 refresh_token 테이블을 두지 않는다. Redis 로 관리하며 근거는 DEC-010 에 있다. spring-boot-starter-data-redis 의존성이 추가로 필요하다
