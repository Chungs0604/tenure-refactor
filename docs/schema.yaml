- id: SCR-026
  name: 아이템 상세 (공개 페이지)
  purpose: 판매 조건·Tenure 기록 기준·판매자 정보 조회, 관심 등록, 구매 진입. 판매중/미판매/판매완료가 한 화면의 상태 변형이다
  auth_required: true
  entities:
  - Item
  - ItemListing
  - ItemMeasurement
  - ItemCondition
  - ListingFeaturedPost
  - PostItemTag
  - Wishlist
  - Report
  - UserBlock
  actions:
  - read
  - create
  - delete
  figma_section: 상품 상세페이지
  evidence: '''판매 상품 상세페이지''(2825:57089), ''미판매 상품 상세 + 구매제안 on''(2825:57652), ''미판매 상품 상세 - 구매제안 off''(2825:57760), ''미판매 상품 상세 페이지''(2825:58233), ''판매 완료 상세 페이지''(2825:58566), ''판매 완료 상세 페이지 - 미판매였던 아이템''(3465:33567). 프레임 6종 모두 헤더가 ''아이템 상세''다'
  variants:
  - state: ON_SALE
    sections: 히어로(가격) · 판매자 정보 · 상품 설명 · Tenure 기록 기준 · 실측 · 상태 이상 체크 · 대표 OOTD
    cta: 채팅하기 · 구매하기
  - state: 'NOT_FOR_SALE (판매를 내린 아이템 — listing 이력 있음)'
    sections: 히어로('미판매') · Tenure 기록 기준 · 대표 OOTD
    cta: 구매제안하기 (offer_allowed=false 면 비활성)
    evidence: 2825:60351 — 판매 조건 섹션 4종이 사라지고 대표 OOTD 는 남는다
  - state: 'NOT_FOR_SALE (판매 전환을 한 번도 안 한 아이템)'
    sections: 히어로('미판매') · Tenure 기록 기준 · 태그된 OOTD
    cta: 구매제안하기 (offer_allowed=false 면 비활성)
    evidence: 2825:58233 — 대표 OOTD 가 없어 태그된 OOTD(post_item_tag)로 대체된다
  - state: SOLD
    sections: 히어로(흑백 처리 + '판매 완료' 초록 배지) · 판매자 정보 · Tenure 기록 기준 · 대표 OOTD 또는 태그된 OOTD
    cta: 없음
    evidence: 2825:58566(판매중이였던) · 3465:33567(미판매였던)
  note: 소유 구간(ItemOwnership) 카드는 이 화면에 없다 — 'Tenure 기록 기준'은 관심·OOTD 인증·최초 보유 날짜·사이즈·착용 대상·카테고리 6칸 그리드뿐이다. 소유 구간은 소유자 시점(SCR-023)의 '아이템 히스토리'에만 있다
- id: SCR-027
  name: 판매 전환 · 판매 정보 수정
  purpose: 아이템을 판매 등록한다. 아이템 정보까지 다시 받는 전체 폼이다
  auth_required: true
  entities:
  - Item
  - ItemImage
  - Category
  - ItemListing
  - ListingFeaturedPost
  - ItemMeasurement
  - ItemCondition
  - PayoutAccount
  actions:
  - create
  - update
  figma_section: 등록한 아이템 / 상품 상세페이지
  evidence: '''판매 전환 CTA 터치시 화면''(3342:32578), ''다 작성된 판매 전환 페이지 - 레코드 사용자 입장''(3342:32943), ''- 기본 사용자 입장''(3342:33318), ''판매 게시가 완료됐습니다.''(2825:51746), ''정산 계좌를 먼저 등록해주세요.''(4765:54024)'
  form_fields: 대표 사진* · 브랜드명* · 아이템명* · 카테고리* · 세부 카테고리* · 사이즈* · 착용 대상* · 수수료 부담* · 배송비* · 가격* · 대표 OOTD(1개 이상)* · 실측 입력 · 상태 이상 체크 · 판매자 설명
  note: |
    수정 화면(3342:33695 레코드 / 3342:34070 기본)은 헤더도 '판매 전환'으로 같고 필드 구성이
    동일하다. CTA 문구만 '판매하기' / '수정하기'로 갈린다. 앞 7개 필드는 item 의 것이라
    판매 전환·수정이 아이템도 함께 갱신한다 (B-9 해소).
    기본 사용자는 수수료 부담 칩 3종이 비활성이고 배송비 입력란이 '0원' 플레이스홀더로 잠긴다 —
    그 둘만 필수 표시(*)가 빠진다.
    '최초 보유 날짜'는 이 폼에 없다. 등록 뒤 불변이라 맞다 (DEC-007 · B-10)
- id: SCR-028
  name: 대표 OOTD 선택
  purpose: 판매 등록에 걸 OOTD 게시물을 1~5개 고른다
  auth_required: true
  entities:
  - ListingFeaturedPost
  - Post
  actions:
  - read
  - create
  - delete
  figma_section: 등록한 아이템
  evidence: '''대표 OOTD 최대 5개 선택 화면''(2825:52006) — 헤더 ''대표 OOTD (최대 5개)'', 내 게시물 masonry 2열, 고른 순서를 카드 우상단에 1·2·3·4 배지로 표시, 하단 CTA ''선택 완료''. ''대표 OOTD 프로토타입''(2825:51979). 전체 보기 화면은 ''대표 OOTD''(2825:61147)'
  note: |
    선택 화면이 그리는 것은 후보 목록(내 게시물 전체)이다. 판매 전환 중에는 아직 item_listing 이
    없으므로 /listings/{listingId}/featured-posts 로는 후보를 가져올 수 없다 — 후보는 내 게시물
    목록(API-081)으로 받고, 고른 결과는 판매 전환·수정 요청의 featuredPostIds 로 함께 보낸다.
    masonry 라 후보·조회 응답 모두 aspectRatio 가 필요하다 (B-5 와 같은 이유)
- id: SCR-029
  name: 판매 상태 변경
  purpose: 미판매 / 판매 완료 전환, 구매 제안 허용 토글
  auth_required: true
  entities:
  - Item
  - ItemListing
  actions:
  - update
  figma_section: 상품 상세페이지 / 등록한 아이템
  evidence: '판매 중 아이템의 ⋮ 메뉴 모달(2825:59974)은 ''수정하기'' / ''미판매로 변경하기'' / ''판매 완료로 변경하기'' / ''닫기'' 4행이다. 결과 화면은 ''미판매로 변경시 화면''(2825:60351)과 ''판매 완료로 변경''(2825:60457), 토스트는 ''변경되었습니다.'''
  note: |
    메뉴에 '판매 등록 삭제'가 없다 — 상태 변경이 삭제를 대신한다(delete_policy B).
    '판매중으로 되돌리기'도 없다. 미판매 아이템을 다시 팔려면 목록의 '판매 전환' 버튼
    (2825:52336)이나 선택 모달(3910:43234)을 거치며, 그때 새 item_listing 이 생긴다.
    구매 제안 허용 토글은 미판매 아이템의 선택 모달에 있고 라벨이 상태에 따라
    '구매 제안 허용'(3910:43234) ↔ '구매 제안 차단'(3910:43454)으로 바뀐다.
    item.offer_allowed 라서 판매 상태 변경이 아니라 아이템 수정으로 처리한다 (DEC-024)
