- id: SCR-024
  name: 아이템 등록 · 상세 정보 수정
  purpose: 브랜드·아이템명·카테고리·사이즈·착용 대상 입력
  auth_required: true
  entities:
  - Item
  - ItemImage
  - Category
  actions:
  - create
  - update
  figma_section: 등록한 아이템 / OOTD 게시물 올리는 과정
  evidence: '''아이템 상세 수정'' 프레임 10종(상의·하의·아우터·원피스·치마·신발·가방·모자·액세서리·쥬얼리), ''새 아이템 등록 터치시 화면'', ''아이템에 관하여 이미 등록된 정보가 있다면 미리 빈칸에 작성되어있습니다.'''
  note: |
    수정 시트는 전체 폼이다 — 현재 값이 전부 채워진 채 열리고 CTA 가 '초기화' / '적용하기'
    둘뿐이라 필드별 저장이 없다. 그래서 API-094 는 PUT 이고 부분 수정을 받지 않는다.
    시트 필드는 브랜드명 · 아이템명 · 카테고리 · 세부 카테고리 · 사이즈 · 착용 대상 6종이다.
    대표 사진 입력란은 10종 어디에도 없다 (B-7) — 사진은 판매 전환(SCR-027)에서만 바꾼다.
    구매 제안 허용도 이 시트가 아니라 선택 모달(3910:43234)의 항목이라 API-116 으로 갈랐다.
    실측·상태 이상도 없다 (B-2).
    '최초 보유 날짜' 는 9종에 남아 있고 상의(2825:49332)만 숨김 처리돼 있다 — 등록 뒤 불변이라
    (DEC-007 · B-10) 서버가 받지 않는다. 디자인에서 9종을 마저 빼야 한다 (B-11).
